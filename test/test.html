<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SimpleSpot Tests</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #ccc; padding: 16px; margin: 0; }
    h1 { color: #1db954; margin-bottom: 16px; }
    .summary { font-size: 18px; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    .summary.pass { background: #1db95430; color: #1db954; }
    .summary.fail { background: #e9113530; color: #e91135; }
    .group { margin: 8px 0; }
    .group-name { font-size: 14px; font-weight: bold; color: #fff; padding: 4px 0; cursor: pointer; }
    .group-name:hover { text-decoration: underline; }
    .test { padding: 2px 16px; font-size: 13px; }
    .test.pass { color: #1db954; }
    .test.pass::before { content: '✓ '; }
    .test.fail { color: #e91135; }
    .test.fail::before { content: '✗ '; }
    .error-detail { color: #ff6b6b; padding: 2px 32px; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>SimpleSpot Tests</h1>
  <div id="results">Running...</div>

  <!-- Hidden app DOM (replicates index.html structure) -->
  <div id="test-dom" style="display:none">
    <div id="login" style="display:flex">
      <button type="button" onclick="loginWith('ncspot')">Login ncspot</button>
      <button type="button" onclick="loginWith('simplespot')">Login simplespot</button>
    </div>
    <div id="app">
      <div class="header">
        <div class="search-container">
          <input type="text" id="search" placeholder="Search tracks..." />
          <span id="search-clear">⊗</span>
        </div>
        <button type="button" id="nav-dj">DJ</button>
        <button type="button" id="nav-playlists">📜</button>
        <button type="button" id="nav-albums">💿</button>
        <button type="button" id="nav-liked">❤️</button>
        <button type="button" id="nav-topArtists">⬆️A</button>
        <button type="button" id="nav-topTracks">⬆️T</button>
        <button type="button" id="nav-explore">✨</button>
        <input type="range" id="column-count" min="1" max="10" value="3" />
        <span id="ncspot-note"></span>
      </div>
      <div class="breadcrumb" id="breadcrumb" style="display:none"></div>
      <div class="content">
        <ul class="tracks" id="tracks"></ul>
        <div id="lyrics-view"></div>
      </div>
      <div class="player">
        <img id="player-art" src="" alt="" style="display:none" />
        <div class="player-info">
          <div id="player-track">Not playing</div>
          <div id="player-artist"></div>
        </div>
        <div class="player-controls">
          <button type="button" id="prev-btn">⏮</button>
          <button type="button" id="play-btn" disabled style="opacity:0.5">▶</button>
          <button type="button" id="next-btn">⏭</button>
        </div>
        <div class="progress-container">
          <span class="progress-time" id="progress-current">0:00</span>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
            <span id="seek-tooltip" style="display:none"></span>
          </div>
          <span class="progress-time" id="progress-total">0:00</span>
        </div>
        <button type="button" id="loop-btn">↻</button>
        <button type="button" id="cc-btn"><span class="cc-icon">CC</span></button>
        <div class="volume-container">
          <input type="range" id="volume-slider" min="0" max="100" value="100" title="Volume: 100%" />
        </div>
        <button type="button" id="nav-queue" class="queue-btn">☰</button>
        <div class="device-picker">
          <button type="button">📱</button>
          <div class="device-menu" id="device-menu"></div>
        </div>
      </div>
    </div>
  </div>

  <template id="template-alert">
    <div class="modal-overlay">
      <div class="modal" style="max-width:500px">
        <h2 id="alert-heading"></h2>
        <p style="color:#b3b3b3;margin:16px 0"><pre id="alert-message"></pre></p>
        <button type="button" onclick="this.closest('.modal-overlay').remove()">Close</button>
      </div>
    </div>
  </template>

  <template id="template-help">
    <div class="modal-overlay" id="help-modal" onclick="if (event.target === this) this.remove()">
      <div class="modal" >
        <h2 style="color:#fff">About <span style="color:#1db954">SimpleSpot</span></h2>
        <p>
          A lightweight Spotify client. Almost all the functionality,
          with almost none of the bloat; minimal CPU usage while
          playing, near-zero while idle.
        </p>
        <p style="padding-bottom:1em"></p>
        <p>
          Uses
          Spotify's <a href="https://developer.spotify.com/documentation/web-api" target="_blank" style="color:#1db954">Web</a>
          and <a href="https://developer.spotify.com/documentation/web-playback-sdk" target="_blank" style="color:#1db954">Web Playback</a>,
          and <a href="https://lrclib.net/docs" target="_blank" style="color:#1db954">LRCLIB</a>'s
          APIs. Requires a <a href="https://developer.spotify.com/documentation/web-playback-sdk#:~:text=The%20Web%20Playback%20SDK%20requires%20a%20Spotify%20Premium%20subscription%20(mobile%20only%20types%20of%20premium%20subscriptions%20are%20excluded) subscription." target="_blank" style="color:#1db954">Spotify Premium</a>.
        </p>
        <hr style="border:none;border-top:1px solid #444;margin:16px 0">
        <h3 style="margin:0 0 8px;font-size:14px;color:#b3b3b3">Keyboard Shortcuts</h3>
        <table id="help-shortcuts"></table>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px">
          <button type="button" onclick="this.closest('.modal-overlay').remove()" style="margin-top:0">Close</button>
          <a href="https://github.com/fischman/SimpleSpot" target="_blank" rel="noopener" title="GitHub" style="color:#666;text-decoration:none;line-height:0;transition:color .15s" onmouseenter="this.style.color='#fff'" onmouseleave="this.style.color='#666'" onclick="event.stopPropagation()">
            <svg width="33" height="33" viewBox="0 0 16 16" fill="currentColor"><title>GitHub logo</title><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
        </div>
      </div>
    </div>
  </template>
  <template id="template-help-shortcut-row">
    <tr>
      <td class="help-shortcut-key" style="color:#fff;font-weight:bold;padding:4px 2em 4px 0"></td>
      <td class="help-shortcut-action" style="color:#b3b3b3;padding:4px 0"></td>
    </tr>
  </template>

  <template id="template-ncspot">
    <div class="modal-overlay" id="ncspot-modal">
      <div class="modal" style="max-width:500px">
        <h2>Login with Spotify (ncspot)</h2>
        <p style="color:#b3b3b3;margin:16px 0">After authorizing, you&quot;ll be redirected to a page that won&quot;t load. Copy the URL from the popup&quot;s address bar and paste it below:</p>
        <button type="button" id="open-spotify-auth" style="width:100%;margin-bottom:16px">
          Open Spotify Auth
        </button>
        <input type="text" id="ncspot-url" placeholder="Paste the redirect URL here (http://127.0.0.1/login?code=...)"
               style="width:100%;padding:10px;border-radius:4px;border:1px solid #444;background:#181818;color:#fff;margin-bottom:16px"
               oninput="const b=document.getElementById('ncspot-continue'),v=!!this.value.trim();b.disabled=!v;b.style.opacity=v?1:0.5;b.style.background=v?'#1db954':'#333'" />
        <div style="display:flex;gap:8px">
          <button type="button" onclick="this.closest('.modal-overlay').remove()" style="flex:1;background:#333">Cancel</button>
          <button type="button" id="ncspot-continue" onclick="handleNcspotUrl()" style="flex:1;opacity:0.5;background:#333" disabled>Continue</button>
        </div>
      </div>
    </div>
  </template>

  <template id="template-device-item">
    <div class="device-item"></div>
  </template>

  <template id="template-device-help">
    <div style="padding:8px;color:#b3b3b3;font-size:12px;border-top:1px solid #404040;margin-top:8px">To play on another device, open this page in another browser or device.</div>
  </template>

  <template id="template-breadcrumb-link">
    <a>Breadcrumb</a>
  </template>

  <template id="template-breadcrumb-text">
    <span></span>
  </template>

  <template id="template-breadcrumb-separator">
    <span> › </span>
  </template>

  <template id="template-breadcrumb-clear-button">
    <button type="button" style="background:#333;border:none;color:#b3b3b3;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:8px">Clear</button>
  </template>

  <template id="template-lyrics-no-track">
    <div class="lyrics-error">No track playing</div>
  </template>

  <template id="template-lyrics-no-lyrics">
    <div class="lyrics-error">No lyrics available</div>
  </template>

  <template id="template-lyrics-loading">
    <div class="lyrics-loading loading-timer">Loading lyrics...</div>
  </template>

  <template id="template-lyrics-content">
    <div>
      <div class="lyrics-title-wrap">
        <div class="lyrics-title">
          <i class="lyrics-track-name"></i>
          <span class="lyrics-separator-artist"> - </span>
          <span class="lyrics-artist-names"></span>
          <span class="lyrics-separator-album"> - </span>
          <i class="lyrics-album-name"></i>
        </div>
      </div>
      <div class="lyrics-lines"></div>
    </div>
  </template>

  <template id="template-lyric-line">
    <div class="lyric-line"></div>
  </template>

  <template id="template-autoplay-failed">
    <div class="modal-overlay" onclick="if (event.target === this) this.remove()">
      <div class="modal" style="max-width:500px">
        <h2 style="color:#fff">Autoplay <span style="color:#1db954">Blocked</span></h2>
        <p>Please select &quot;Allow&quot; (not just &quot;Automatic (default)&quot;) for Sound in your browser site settings to enable autoplay:</p>
        <p id="autoplay-settings-url" style="user-select:all;font-family:monospace;background:#333;padding:8px;border-radius:4px;word-break:break-all"></p>
        <button type="button" onclick="this.closest('.modal-overlay').remove()">OK</button>
      </div>
    </div>
  </template>

  <script src="fixtures.js"></script>
  <script src="mocks.js"></script>
  <script src="../app.js"></script>
  <script src="tests.js"></script>
</body>
</html>
