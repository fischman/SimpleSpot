<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' font-size='80' fill='%231db954' text-anchor='middle' dominant-baseline='central'%3E♫%3C/text%3E%3C/svg%3E">
  <title>Spotify Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; min-height: 100vh; min-height: 100dvh; }
    #login { display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; }
    #login button { background: #1db954; color: #fff; border: none; padding: 16px 32px; font-size: 18px; border-radius: 24px; cursor: pointer; }
    #app { display: none; }
    .header { padding: 16px; background: #181818; display: flex; gap: 16px; align-items: center; }
    .header input[type="text"] { flex: 1; padding: 10px 16px; border-radius: 20px; border: none; background: #282828; color: #fff; }
    .header button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; }
    .content { padding: 16px; }
    .player { position: fixed; bottom: 0; left: 0; right: 0; background: #181818; padding: 16px; display: flex; align-items: center; gap: 16px; }
    .player img { width: 56px; height: 56px; border-radius: 4px; }
    .player-info { flex: 1; }
    .player-controls { display: flex; gap: 16px; align-items: center; }
    .player-controls button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .tracks { list-style: none; column-count: var(--column-count, 3); column-gap: 4px; }
    .tracks > * { break-inside: avoid; }
    .tracks h3 { column-span: all; }
    .track { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 4px; cursor: pointer; min-width: 0; }
    .track:hover { background: #282828; }
    .track img { width: 40px; height: 40px; border-radius: 4px; flex-shrink: 0; }
    .track-info { flex: 1; min-width: 0; overflow: hidden; }
    .track-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-num { color: #b3b3b3; font-size: 14px; min-width: 24px; text-align: right; }
    .device-picker { position: relative; }
    .device-picker button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; }
    .device-menu { position: absolute; bottom: 100%; right: 0; background: #282828; border-radius: 8px; padding: 8px; min-width: 200px; display: none; }
    .device-menu.show { display: block; }
    .device-item { padding: 8px; border-radius: 4px; cursor: pointer; }
    .device-item:hover { background: #383838; }
    .device-item.active { color: #1db954; background: #1db95420; }
    .progress-container { display: flex; align-items: center; gap: 8px; width: 300px; }
    .progress-bar { flex: 1; height: 4px; background: #404040; border-radius: 2px; cursor: pointer; position: relative; }
    .progress-bar:hover { height: 6px; }
    .progress-fill { height: 100%; background: #1db954; border-radius: 2px; width: 0%; }
    .progress-time { font-size: 11px; color: #b3b3b3; min-width: 40px; }
    .volume-container { display: flex; align-items: center; gap: 8px; }
    .volume-bar { width: 80px; height: 4px; background: #404040; border-radius: 2px; cursor: pointer; }
    .volume-bar:hover { height: 6px; }
    .volume-fill { height: 100%; background: #1db954; border-radius: 2px; width: 50%; }
    .queue-btn { background: none; border: none; color: #b3b3b3; font-size: 18px; cursor: pointer; }
    .queue-btn:hover { color: #fff; }
    .track-album { font-size: 12px; color: #b3b3b3; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-album:hover { text-decoration: underline; }
    #column-count { width: 100px; cursor: pointer; }
    
    /* Mobile styles */
    @media (max-width: 600px) {
      #column-count { display: none; }
      .tracks { column-count: 1; }
      .player { bottom: env(safe-area-inset-bottom, 0); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0)); flex-wrap: wrap; gap: 8px; }
      .progress-container { width: 100%; order: 10; }
      .volume-container { display: none; }
    }
    .breadcrumb { padding: 8px 16px; background: #181818; border-bottom: 1px solid #282828; font-size: 14px; }
    .breadcrumb a { color: #b3b3b3; cursor: pointer; }
    .breadcrumb a:hover { color: #fff; }
    .content { padding: 16px; padding-bottom: 120px; }
    .artist-link { color: #b3b3b3; cursor: pointer; }
    .artist-link:hover { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="login"><button onclick="login()">Login with Spotify</button></div>
  <div id="app">
    <div class="header">
      <input type="text" id="search" placeholder="Search tracks..." />
      <button onclick="loadLikedSongs()" title="Liked Songs">❤️</button>
      <button onclick="loadSavedAlbums()" title="Saved Albums">💿</button>
      <button onclick="loadPlaylists()" title="My Playlists">📜</button>
      <input type="range" id="column-count" min="1" max="10" value="3" oninput="setColumnCount(this.value)" title="Columns" />
    </div>
    <div class="breadcrumb" id="breadcrumb" style="display:none"></div>
    <div class="content"><ul class="tracks" id="tracks"></ul></div>
    <div class="player">
      <img id="player-art" src="" alt="" style="cursor:pointer;display:none" onclick="showCurrentAlbum()" />
      <div class="player-info">
        <div id="player-track">Not playing</div>
        <div id="player-artist" style="color:#b3b3b3;font-size:12px"></div>
      </div>
      <div class="player-controls">
        <button onclick="previous()">⏮</button>
        <button onclick="togglePlay()" id="play-btn" disabled style="opacity:0.5">▶</button>
        <button onclick="next()">⏭</button>
      </div>
      <div class="progress-container">
        <span class="progress-time" id="progress-current">0:00</span>
        <div class="progress-bar" id="progress-bar" onclick="seek(event)">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-time" id="progress-total">0:00</span>
      </div>
      <div class="volume-container">
        <span>🔊</span>
        <div class="volume-bar" id="volume-bar" onclick="setVolume(event)">
          <div class="volume-fill" id="volume-fill"></div>
        </div>
      </div>
      <button class="queue-btn" onclick="showQueue()" title="Queue">☰</button>
      <div class="device-picker">
        <button onclick="toggleDevices()" title="Devices">📱</button>
        <div class="device-menu" id="device-menu"></div>
      </div>
    </div>
  </div>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
// Config - user must set these
const CLIENT_ID = '1366988155e64d34b759879f2a575cdd';
const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
const SCOPES = 'streaming user-read-email user-read-private user-library-read user-read-playback-state user-modify-playback-state playlist-read-private';

let accessToken = null;
let player = null;
let deviceId = null;
let currentState = null;
let currentAlbumUri = null;
let currentPlaylistContext = null;
let progressInterval = null;
let lastTrackUri = null;
let lastPlayState = null;
let queueRefreshPending = false;

// PKCE helpers
function generateCodeVerifier() {
  const arr = new Uint8Array(64);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr)).replace(/[^a-zA-Z0-9]/g, '').slice(0, 128);
}

async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function login() {
  const verifier = generateCodeVerifier();
  localStorage.setItem('code_verifier', verifier);
  const challenge = await generateCodeChallenge(verifier);
  
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  window.location = 'https://accounts.spotify.com/authorize?' + params;
}

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (!code) return false;
  
  const verifier = localStorage.getItem('code_verifier');
  
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier
    })
  });
  const data = await res.json();
  if (data.access_token) {
    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('refresh_token', data.refresh_token);
    localStorage.setItem('token_expiry', Date.now() + data.expires_in * 1000);
    window.history.replaceState({}, '', REDIRECT_URI);
    return true;
  }
  return false;
}

async function refreshToken() {
  const refresh = localStorage.getItem('refresh_token');
  if (!refresh) return false;
  
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: refresh
    })
  });
  const data = await res.json();
  if (data.access_token) {
    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('token_expiry', Date.now() + data.expires_in * 1000);
    return true;
  }
  return false;
}

async function api(endpoint, opts = {}) {
  const res = await fetch('https://api.spotify.com/v1' + endpoint, {
    ...opts,
    headers: { Authorization: 'Bearer ' + accessToken, ...opts.headers }
  });
  if (res.status === 204) return null;
  return res.json();
}

function getDeviceName() {
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) return 'Android';
  if (/iPhone/i.test(ua)) return 'iPhone';
  if (/iPad/i.test(ua)) return 'iPad';
  if (/Mac/i.test(ua)) return 'Mac';
  if (/Windows/i.test(ua)) return 'Windows';
  if (/Linux/i.test(ua)) return 'Linux';
  return 'Browser';
}

function initPlayer() {
  player = new Spotify.Player({
    name: getDeviceName(),
    getOAuthToken: cb => cb(accessToken),
    volume: 0.5
  });
  
  player.addListener('ready', ({ device_id }) => {
    deviceId = device_id;
    console.log('Player ready:', device_id);
    setupMediaSessionHandlers();
    resumePlaybackIfNeeded();
  });
  
  player.addListener('player_state_changed', state => {
    if (!state) return;
    currentState = state;
    const track = state.track_window.current_track;
    currentAlbumUri = track.album.uri;
    document.getElementById('player-track').textContent = track.name;
    document.getElementById('player-artist').textContent = track.artists.map(a => a.name).join(', ');
    const art = document.getElementById('player-art');
    art.src = track.album.images[0]?.url || '';
    art.style.display = track.album.images[0]?.url ? 'block' : 'none';
    const playBtn = document.getElementById('play-btn');
    playBtn.textContent = state.paused ? '▶' : '⏸';
    playBtn.disabled = false;
    playBtn.style.opacity = '1';
    document.getElementById('progress-total').textContent = formatTime(state.duration);
    updateProgress();
    
    // Use interval only when playing, update every second
    clearInterval(progressInterval);
    if (!state.paused) {
      progressInterval = setInterval(updateProgress, 1000);
    }
    
    // Update MPRIS / Media Session
    updateMediaSession(track, state);
    
    // Store play state in memory (saved to localStorage on beforeunload)
    const nextTracks = state.track_window.next_tracks.map(t => t.uri);
    lastPlayState = {
      trackUri: track.uri,
      position: state.position,
      paused: state.paused,
      contextUri: state.context?.uri || null,
      queue: nextTracks,
      timestamp: Date.now()
    };
    
    // Auto-refresh queue view if track changed externally (track ended, cast control, etc)
    if (track.uri !== lastTrackUri) {
      lastTrackUri = track.uri;
      // Debounce: only refresh if we didn't just trigger it ourselves
      if (!queueRefreshPending && localStorage.getItem('last_view') === 'queue') {
        setTimeout(showQueue, 500);
      }
    }
  });
  
  player.connect();
}

window.onSpotifyWebPlaybackSDKReady = () => {
  if (accessToken) initPlayer();
};

// Utility
function showLoading() {
  document.getElementById('tracks').innerHTML = '<li style="padding:16px;color:#b3b3b3">Loading...</li>';
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Progress & Volume
function updateProgress() {
  if (!currentState) return;
  player.getCurrentState().then(state => {
    if (!state) return;
    const pct = (state.position / state.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-current').textContent = formatTime(state.position);
  });
}

function seek(e) {
  if (!currentState) return;
  const bar = document.getElementById('progress-bar');
  const pct = e.offsetX / bar.offsetWidth;
  player.seek(pct * currentState.duration);
}

function setVolume(e) {
  const bar = document.getElementById('volume-bar');
  const pct = e.offsetX / bar.offsetWidth;
  player.setVolume(pct);
  document.getElementById('volume-fill').style.width = (pct * 100) + '%';
}

// Search
async function search(q) {
  setBreadcrumb([{ name: 'Search: ' + q }]);
  showLoading();
  const data = await api('/search?type=track,album&limit=20&q=' + encodeURIComponent(q));
  localStorage.setItem('last_search', JSON.stringify({ query: q, data: data }));
  localStorage.setItem('last_view', 'search');
  renderSearchResults(data);
}

function renderSearchResults(data) {
  const el = document.getElementById('tracks');
  let html = '';
  if (data.albums?.items.length) {
    html += '<h3 style="padding:8px;color:#b3b3b3">Albums</h3>';
    html += data.albums.items.slice(0, 5).map((a, i) => `
      <li class="track" onclick="loadAlbum('${a.id}')">
        <span class="track-num">${i + 1}</span>
        <img src="${a.images[2]?.url || ''}" />
        <div class="track-info">
          <div class="track-name">${escapeHtml(a.name)}</div>
          <div class="track-artist">${escapeHtml(a.artists.map(x => x.name).join(', '))}</div>
        </div>
      </li>
    `).join('');
  }
  if (data.tracks?.items.length) {
    html += '<h3 style="padding:8px;color:#b3b3b3">Tracks</h3>';
    html += renderTrackItems(data.tracks.items, null);
  }
  el.innerHTML = html;
}

// Tracks rendering with context
function renderTrackItems(tracks, contextUri, isQueueRemove = false, isQueueView = false, startNum = 1) {
  return tracks.map((t, i) => {
    const artistLinks = t.artists?.map(a => 
      `<span class="artist-link" onclick="event.stopPropagation(); loadArtist('${a.id}')">${escapeHtml(a.name)}</span>`
    ).join(', ') || '';
    const clickAction = isQueueView 
      ? `skipToQueuePosition(${i})` 
      : `playFromContext('${contextUri || ''}', ${i}, '${t.uri}')`;
    return `
    <li class="track" onclick="${clickAction}">
      <span class="track-num">${startNum + i}</span>
      <img src="${t.album?.images?.[2]?.url || ''}" />
      <div class="track-info">
        <div class="track-name">${escapeHtml(t.name)}</div>
        <div class="track-artist">${artistLinks}</div>
        ${t.album ? `<div class="track-album" onclick="event.stopPropagation(); loadAlbum('${t.album.id}')">${escapeHtml(t.album.name)}</div>` : ''}
      </div>
      ${isQueueRemove 
        ? `<button class="queue-btn" onclick="event.stopPropagation(); skipQueueTrack(${i})" title="Skip (remove not supported)">−</button>`
        : `<button class="queue-btn" onclick="event.stopPropagation(); addToQueue('${t.uri}')" title="Add to queue">+</button>`
      }
    </li>
  `}).join('');
}

async function playFromContext(contextUri, offset, trackUri) {
  const body = contextUri 
    ? { context_uri: contextUri, offset: { position: offset } }
    : { uris: [trackUri] };
  await api('/me/player/play?device_id=' + deviceId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}

async function addToQueue(uri) {
  await api('/me/player/queue?uri=' + encodeURIComponent(uri), { method: 'POST' });
}

async function togglePlay() {
  // If player has no track loaded, try to resume from saved state
  const state = await player?.getCurrentState();
  if (!state) {
    const saved = localStorage.getItem('play_state');
    if (saved) {
      const s = JSON.parse(saved);
      const body = s.contextUri
        ? { context_uri: s.contextUri, offset: { uri: s.trackUri }, position_ms: s.position }
        : { uris: [s.trackUri], position_ms: s.position };
      await api('/me/player/play?device_id=' + deviceId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return;
    }
  }
  player?.togglePlay();
}

async function next() {
  await api('/me/player/next', { method: 'POST' });
  refreshQueueIfViewing();
}

async function previous() {
  await api('/me/player/previous', { method: 'POST' });
  refreshQueueIfViewing();
}

function refreshQueueIfViewing() {
  if (localStorage.getItem('last_view') === 'queue') {
    queueRefreshPending = true;
    showQueue().then(() => {
      queueRefreshPending = false;
    });
  }
}

// Devices
async function loadDevices() {
  const data = await api('/me/player/devices');
  const menu = document.getElementById('device-menu');
  menu.innerHTML = data.devices.map(d => `
    <div class="device-item ${d.is_active ? 'active' : ''}" onclick="transferPlayback('${d.id}')">
      ${escapeHtml(d.name)}
    </div>
  `).join('');
}

function toggleDevices() {
  const menu = document.getElementById('device-menu');
  menu.classList.toggle('show');
  if (menu.classList.contains('show')) loadDevices();
}

async function transferPlayback(id) {
  await api('/me/player', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ device_ids: [id] })
  });
  document.getElementById('device-menu').classList.remove('show');
}

// Cast - shows non-computer devices (Chromecast, speakers, TVs, etc)

// Playlists
async function loadLikedSongs() {
  setBreadcrumb([{ name: 'Liked Songs' }]);
  showLoading();
  const data = await api('/me/tracks?limit=50');
  const tracks = data.items.map(i => i.track).filter(t => t);
  document.getElementById('tracks').innerHTML = renderTrackItems(tracks, null);
}

async function loadSavedAlbums() {
  setBreadcrumb([{ name: 'Saved Albums' }]);
  showLoading();
  const data = await api('/me/albums?limit=50');
  const el = document.getElementById('tracks');
  el.innerHTML = data.items.map((item, i) => {
    const a = item.album;
    return `
    <li class="track" onclick="loadAlbum('${a.id}')">
      <span class="track-num">${i + 1}</span>
      <img src="${a.images?.[2]?.url || ''}" />
      <div class="track-info">
        <div class="track-name">${escapeHtml(a.name)}</div>
        <div class="track-artist">${escapeHtml(a.artists.map(x => x.name).join(', '))}</div>
      </div>
    </li>
  `}).join('');
}

async function loadPlaylists() {
  setBreadcrumb([{ name: 'Playlists' }]);
  showLoading();
  const data = await api('/me/playlists?limit=50');
  const el = document.getElementById('tracks');
  el.innerHTML = data.items.map((p, i) => `
    <li class="track" onclick="loadPlaylist('${p.id}', '${escapeHtml(p.name).replace(/'/g, "\\'")}')">
      <span class="track-num">${i + 1}</span>
      <img src="${p.images?.[0]?.url || ''}" />
      <div class="track-info">
        <div class="track-name">${escapeHtml(p.name)}</div>
        <div class="track-artist">${p.tracks.total} tracks</div>
      </div>
    </li>
  `).join('');
}

async function loadPlaylist(id, name) {
  setBreadcrumb([
    { name: 'Playlists', action: 'loadPlaylists()' },
    { name: name || 'Playlist' }
  ]);
  currentPlaylistContext = 'spotify:playlist:' + id;
  const data = await api('/playlists/' + id + '/tracks?limit=100');
  const tracks = data.items.map(i => i.track).filter(t => t);
  document.getElementById('tracks').innerHTML = renderTrackItems(tracks, currentPlaylistContext);
}

// Albums
async function loadAlbum(id) {
  const data = await api('/albums/' + id);
  setBreadcrumb([
    { name: 'Album: ' + data.name }
  ]);
  const contextUri = data.uri;
  const tracks = data.tracks.items.map(t => ({ ...t, album: { id: data.id, name: data.name, images: data.images } }));
  const artistLinks = data.artists.map(a => 
    `<span class="artist-link" onclick="loadArtist('${a.id}')">${escapeHtml(a.name)}</span>`
  ).join(', ');
  document.getElementById('tracks').innerHTML = `
    <div style="display:flex;gap:16px;padding:16px;align-items:flex-end">
      <img src="${data.images?.[1]?.url || ''}" style="width:150px;height:150px;border-radius:4px" />
      <div>
        <div style="font-size:12px;color:#b3b3b3">ALBUM</div>
        <h1 style="font-size:32px;margin:8px 0">${escapeHtml(data.name)}</h1>
        <div style="color:#b3b3b3">${artistLinks} • ${data.release_date?.slice(0,4)} • ${data.total_tracks} tracks</div>
      </div>
    </div>
  ` + renderTrackItems(tracks, contextUri);
}

async function showCurrentAlbum() {
  if (!currentAlbumUri) return;
  const id = currentAlbumUri.split(':')[2];
  loadAlbum(id);
}

// Artist
async function loadArtist(id) {
  const [artist, topTracks, albums] = await Promise.all([
    api('/artists/' + id),
    api('/artists/' + id + '/top-tracks?market=US'),
    api('/artists/' + id + '/albums?include_groups=album,single&limit=20')
  ]);
  
  setBreadcrumb([{ name: artist.name }]);
  
  const el = document.getElementById('tracks');
  let html = `
    <div style="display:flex;gap:16px;padding:16px;align-items:flex-end">
      <img src="${artist.images?.[1]?.url || ''}" style="width:150px;height:150px;border-radius:50%" />
      <div>
        <div style="font-size:12px;color:#b3b3b3">ARTIST</div>
        <h1 style="font-size:32px;margin:8px 0">${escapeHtml(artist.name)}</h1>
        <div style="color:#b3b3b3">${artist.followers?.total?.toLocaleString() || 0} followers</div>
      </div>
    </div>
  `;
  
  if (topTracks.tracks?.length) {
    html += '<h3 style="padding:8px 16px;color:#b3b3b3">Top Tracks</h3>';
    html += renderTrackItems(topTracks.tracks.slice(0, 5), null);
  }
  
  if (albums.items?.length) {
    html += '<h3 style="padding:8px 16px;color:#b3b3b3">Discography</h3>';
    html += albums.items.map((a, i) => `
      <li class="track" onclick="loadAlbum('${a.id}')">
        <span class="track-num">${i + 1}</span>
        <img src="${a.images?.[2]?.url || ''}" />
        <div class="track-info">
          <div class="track-name">${escapeHtml(a.name)}</div>
          <div class="track-artist">${a.album_type} • ${a.release_date?.slice(0,4)}</div>
        </div>
      </li>
    `).join('');
  }
  
  el.innerHTML = html;
}

// Queue
async function showQueue() {
  setBreadcrumb([{ name: 'Queue', suffix: '<button onclick="clearQueue()" style="background:#333;border:none;color:#b3b3b3;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:8px">Clear</button>' }]);
  showLoading();
  const data = await api('/me/player/queue');
  localStorage.setItem('last_queue', JSON.stringify(data));
  localStorage.setItem('last_view', 'queue');
  renderQueue(data);
}

function renderQueue(data) {
  const el = document.getElementById('tracks');
  let html = '';
  if (data.currently_playing) {
    html += '<h3 style="padding:8px;color:#b3b3b3">Now Playing</h3>';
    html += renderTrackItems([data.currently_playing], null, false, false);
  }
  if (data.queue?.length) {
    html += `<h3 style="padding:8px;color:#b3b3b3">Next Up (${data.queue.length})</h3>`;
    html += renderTrackItems(data.queue, null, true, true);
  }
  el.innerHTML = html || '<p style="padding:16px;color:#b3b3b3">Queue is empty</p>';
}

async function skipQueueTrack(index) {
  // Spotify API doesn't support removing from queue, only skipping
  // Skip (index + 1) times to get past this track
  for (let i = 0; i <= index; i++) {
    await api('/me/player/next', { method: 'POST' });
  }
  showQueue();
}

async function skipToQueuePosition(index) {
  // Skip to position in queue by calling next repeatedly
  for (let i = 0; i <= index; i++) {
    await api('/me/player/next', { method: 'POST' });
  }
  showQueue();
}

async function clearQueue() {
  // Disconnect and reconnect player to fully stop playback
  player.disconnect();
  
  // Clear localStorage
  localStorage.removeItem('play_state');
  localStorage.removeItem('last_queue');
  
  // Clear the view
  document.getElementById('tracks').innerHTML = '<p style="padding:16px;color:#b3b3b3">Queue is empty</p>';
  
  // Reset UI
  document.getElementById('player-track').textContent = 'Not playing';
  document.getElementById('player-artist').textContent = '';
  document.getElementById('player-art').style.display = 'none';
  document.getElementById('play-btn').disabled = true;
  document.getElementById('play-btn').style.opacity = '0.5';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-current').textContent = '0:00';
  document.getElementById('progress-total').textContent = '0:00';
  
  // Reconnect player
  player.connect();
}

// Breadcrumb
function setBreadcrumb(items) {
  const el = document.getElementById('breadcrumb');
  if (!items.length) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = items.map((item, i) => 
    item.action 
      ? `<a onclick="${item.action}">${escapeHtml(item.name)}</a>${i < items.length - 1 ? ' › ' : ''}`
      : `<span>${escapeHtml(item.name)}${item.suffix || ''}</span>`
  ).join('');
}

// Init
(async () => {
  if (await handleCallback() || localStorage.getItem('access_token')) {
    if (Date.now() > localStorage.getItem('token_expiry')) {
      if (!await refreshToken()) { localStorage.clear(); return; }
    }
    accessToken = localStorage.getItem('access_token');
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (window.Spotify) initPlayer();
    
    // Restore last view from localStorage
    restoreLastView();
  }
})();

function restoreLastView() {
  const lastSearch = localStorage.getItem('last_search');
  const lastQueue = localStorage.getItem('last_queue');
  const lastView = localStorage.getItem('last_view');
  
  if (lastView === 'queue' && lastQueue) {
    try {
      const data = JSON.parse(lastQueue);
      setBreadcrumb([{ name: 'Queue' }]);
      renderQueue(data);
    } catch (e) {}
  } else if (lastSearch) {
    try {
      const { query, data } = JSON.parse(lastSearch);
      document.getElementById('search').value = query;
      setBreadcrumb([{ name: 'Search: ' + query }]);
      renderSearchResults(data);
    } catch (e) {}
  }
}

document.getElementById('search').addEventListener('keyup', e => {
  if (e.key === 'Enter' && e.target.value) search(e.target.value);
});

// Save play state before page unload (before player disconnects and sets paused=true)
window.addEventListener('beforeunload', () => {
  if (lastPlayState) {
    lastPlayState.timestamp = Date.now();
    localStorage.setItem('play_state', JSON.stringify(lastPlayState));
  }
});

// Column count control
function setColumnCount(count) {
  document.documentElement.style.setProperty('--column-count', count);
  localStorage.setItem('column_count', count);
}

// Restore column count on load
(function() {
  const saved = localStorage.getItem('column_count');
  if (saved) {
    setColumnCount(saved);
    document.getElementById('column-count').value = saved;
  }
})();

// Spacebar to toggle play/pause (when not in input)
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    togglePlay();
  }
});

// Media Session API (MPRIS support)
function updateMediaSession(track, state) {
  if (!('mediaSession' in navigator)) return;
  
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.name,
    artist: track.artists.map(a => a.name).join(', '),
    album: track.album.name,
    artwork: track.album.images.map(img => ({
      src: img.url,
      sizes: `${img.width || 300}x${img.height || 300}`,
      type: 'image/jpeg'
    }))
  });
  
  navigator.mediaSession.playbackState = state.paused ? 'paused' : 'playing';
  
  if (state.duration) {
    navigator.mediaSession.setPositionState({
      duration: state.duration / 1000,
      position: state.position / 1000,
      playbackRate: 1
    });
  }
}

function setupMediaSessionHandlers() {
  if (!('mediaSession' in navigator)) return;
  
  navigator.mediaSession.setActionHandler('play', () => player?.resume());
  navigator.mediaSession.setActionHandler('pause', () => player?.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => player?.previousTrack());
  navigator.mediaSession.setActionHandler('nexttrack', () => player?.nextTrack());
  navigator.mediaSession.setActionHandler('seekto', (details) => {
    if (details.seekTime !== undefined) {
      player?.seek(details.seekTime * 1000);
    }
  });
}

async function resumePlaybackIfNeeded() {
  const saved = localStorage.getItem('play_state');
  if (!saved) {
    console.log('No play state saved');
    return;
  }
  
  try {
    const state = JSON.parse(saved);
    const age = Date.now() - state.timestamp;
    console.log('Saved play state:', state, 'age:', age);
    
    // Only restore if saved within last 5 minutes
    if (age > 5 * 60 * 1000) {
      console.log('Play state too old, not resuming');
      return;
    }
    
    // Fetch track info to update UI
    const trackData = await api('/tracks/' + state.trackUri.split(':')[2]);
    if (trackData) {
      document.getElementById('player-track').textContent = trackData.name;
      document.getElementById('player-artist').textContent = trackData.artists.map(a => a.name).join(', ');
      const art = document.getElementById('player-art');
      art.src = trackData.album.images[0]?.url || '';
      art.style.display = trackData.album.images[0]?.url ? 'block' : 'none';
      document.getElementById('progress-current').textContent = formatTime(state.position);
      document.getElementById('progress-total').textContent = formatTime(trackData.duration_ms);
      document.getElementById('progress-fill').style.width = ((state.position / trackData.duration_ms) * 100) + '%';
      currentAlbumUri = trackData.album.uri;
    }
    
    // Enable play button
    const playBtn = document.getElementById('play-btn');
    playBtn.disabled = false;
    playBtn.style.opacity = '1';
    playBtn.textContent = state.paused ? '▶' : '⏸';
    
    if (state.paused) {
      console.log('Was paused, showing paused state');
      return;
    }
    
    // Resume playback
    const body = state.contextUri
      ? { context_uri: state.contextUri, offset: { uri: state.trackUri }, position_ms: state.position }
      : { uris: [state.trackUri], position_ms: state.position };
    
    console.log('Resuming with:', body);
    const result = await api('/me/player/play?device_id=' + deviceId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    console.log('Resume result:', result);
    
    // Restore queue if we have saved tracks and no context
    if (!state.contextUri && state.queue?.length) {
      console.log('Restoring queue:', state.queue.length, 'tracks');
      for (const uri of state.queue) {
        await api('/me/player/queue?uri=' + encodeURIComponent(uri), { method: 'POST' });
      }
    }
  } catch (e) {
    console.log('Could not resume playback:', e);
  }
}
