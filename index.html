<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23121212'/%3E%3Cpath d='M180 140 L180 372 L360 256 Z' fill='%231db954'/%3E%3Cpath d='M380 180 Q420 256 380 332' stroke='%231db954' stroke-width='24' fill='none' stroke-linecap='round'/%3E%3Cpath d='M420 140 Q480 256 420 372' stroke='%231db954' stroke-width='24' fill='none' stroke-linecap='round' opacity='0.6'/%3E%3C/svg%3E">
  <link rel="manifest" id="manifest-link">
  <script>
    // This JS is necessary to convert the inline SVG favicon above to
    // a PNG data URI that can be passed to manifest.icons[0].src
    // below, since apparently it doesn't support SVG :/
    const img = document.createElement('img')
    img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight);
        const png = canvas.toDataURL(`image/image/png`, 1.0)
        const manifest = {
            name: 'SimpleSpot',
            short_name: 'SimpleSpot',
            display: 'standalone',
            background_color: '#121212',
            theme_color: '#121212',
            icons: [ { sizes: '64x64', type: 'image/png', src: png } ]
        };
        document.getElementById('manifest-link').href = `data:application/manifest+json,${encodeURIComponent(JSON.stringify(manifest))}`;
    };
    img.src = document.getElementById('favicon').href;
  </script>
  
  <title>SimpleSpot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #535353; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #727272; }
    * { scrollbar-width: thin; scrollbar-color: #535353 #121212; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; }
    #login { display: flex; align-items: center; justify-content: center; height: 100dvh; }
    #login button { background: #1db954; color: #fff; border: none; padding: 16px 32px; font-size: 18px; border-radius: 24px; cursor: pointer; }
    #app { display: none; height: 100dvh; flex-direction: column; }
    #app.show { display: flex; }
    .header { padding: 16px; background: #181818; display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
    .search-container { position: relative; flex: 1; }
    .header input[type="text"] { width: 100%; padding: 10px 32px 10px 16px; border-radius: 20px; border: none; background: #282828; color: #fff; box-sizing: border-box; }
    #search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #b3b3b3; cursor: pointer; }
    #search-clear:hover { color: #fff; }
    .header button { background: none; font-size: 20px; cursor: pointer; padding: 8px; color: #b3b3b3; border-radius: 8px; border: 2px solid transparent; }
    .header button.active, .player button.active { border-color: #1db954; }
    .header button.active:focus, .player button.active:focus { outline: none; }
    .player { background: #181818; padding: 16px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .player img { width: 56px; height: 56px; border-radius: 4px; }
    .player-info { flex: 1; }
    .player-controls { display: flex; align-items: center; }
    .player-controls button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; width: 32px; height: 32px; line-height: 32px; text-align: center; padding: 0; }
    .tracks { list-style: none; column-count: var(--column-count, 3); column-gap: 4px; }
    .tracks > * { break-inside: avoid; }
    .tracks h3 { column-span: all; }
    .track { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 4px; cursor: pointer; min-width: 0; }
    .track:hover { background: #282828; }
    .track-art { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
    .track-art img { width: 100%; height: 100%; border-radius: 4px; }
    .track-art .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); border-radius: 4px; opacity: 0; transition: opacity 0.15s; cursor: pointer; }
    .track-art .play-overlay::before { content: '▶'; color: #fff; font-size: 16px; }
    .track-art:hover .play-overlay { opacity: 1; }
    .track-info { flex: 1; min-width: 0; overflow: hidden; }
    .track-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-num { color: #b3b3b3; font-size: 14px; min-width: 24px; text-align: center; }
    .track-num-col { display: flex; flex-direction: column; align-items: center; min-width: 24px; gap: 2px; }
    .track-num-col .queue-btn { font-size: 14px; padding: 0; line-height: 1; }
    .track-num-col .radio-btn { font-size: 12px; padding: 0; line-height: 1; background: none; border: none; color: #b3b3b3; cursor: pointer; }
    .track-num-col .radio-btn:hover { color: #1db954; }
    .track-num-col .radio-btn.unavailable { opacity: 0.4; cursor: not-allowed; }
    .track-num-col .radio-btn.unavailable:hover { color: #b3b3b3; }
    .drag-handle { cursor: grab; color: #666; padding: 8px; font-size: 16px; user-select: none; }
    .drag-handle:hover { color: #b3b3b3; }
    .drag-handle:active { cursor: grabbing; }
    .track.dragging { opacity: 0.5; background: #333; }
    .track.drag-over { border-top: 2px solid #1db954; }
    .device-picker { position: relative; }
    .device-picker button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; }
    .device-menu { position: absolute; bottom: 100%; right: 0; background: #282828; border-radius: 8px; padding: 8px; min-width: 200px; display: none; }
    .device-menu.show { display: block; }
    .device-item { padding: 8px; border-radius: 4px; cursor: pointer; }
    .device-item:hover { background: #383838; }
    .device-item.active { color: #1db954; background: #1db95420; }
    .progress-container { display: flex; align-items: center; gap: 8px; width: 300px; }
    .progress-bar { flex: 1; height: 4px; background: #404040; border-radius: 2px; cursor: pointer; position: relative; }
    .progress-bar:hover { height: 6px; }
    .progress-fill { height: 100%; background: #1db954; border-radius: 2px; width: 0%; }
    .progress-time { font-size: 11px; color: #b3b3b3; min-width: 40px; }
    .queue-btn { background: none; color: #b3b3b3; font-size: 18px; cursor: pointer; border-radius: 8px; padding: 4px 8px; border: 2px solid transparent; }
    .queue-btn:hover { color: #fff; }
    .queue-btn.active { border-color: #1db954; }
    button#loop-btn, button#cc-btn { background: none; border: none; padding: 8px; color: #b3b3b3; cursor: pointer; }
    .cc-icon { border: 1px solid currentColor; border-radius: 2px; padding: 1px 3px; font-size: 12px; font-weight: bold; }
    button#loop-btn:hover, button#cc-btn:hover { color: #fff; }
    button#loop-btn.active, button#cc-btn.active { color: #1db954; }
    #lyrics-view { display: none; background: #121212; text-align: center; }
    #lyrics-view.active { display: block; }
    .lyrics-title-wrap { background: #121212; position: sticky; top: -16px; margin: -16px -16px 0 -16px; padding: 16px; }
    .lyrics-title { font-size: 32px; color: #b3b3b3; border-bottom: 1px solid #b3b3b3; display: inline-block; padding-bottom: 8px; }
    .lyrics-lines { padding: 0 20px 20px; }
    #lyrics-view .lyric-line { padding: 4px 16px; font-size: 24px; color: #666; transition: all 0.3s; cursor: pointer; }
    #lyrics-view .lyric-line.plain { color: #fff; cursor: default; }
    #lyrics-view .lyric-line:hover { color: #999; }
    #lyrics-view .lyric-line.active { color: #fff; font-size: 28px; font-weight: bold; }
    #lyrics-view .lyrics-error { color: #b3b3b3; font-size: 18px; margin-top: 40px; }
    .track-album { font-size: 12px; color: #b3b3b3; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-album:hover { text-decoration: underline; }
    #column-count { width: 100px; cursor: pointer; }
    
    /* Mobile styles */
    @media (max-width: 600px) {
      #column-count { display: none; }
      .header { gap: 8px; }
      .search-container { min-width: 60px; }
      .search-container:focus-within { position: absolute; left: 8px; right: 8px; z-index: 10; }
      #search-clear { display: none; }
      .search-container:focus-within #search-clear { display: block; }
      .tracks { column-count: 1; }
      .player { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0)); flex-wrap: wrap; gap: 8px; }
      .progress-container { width: 100%; order: 10; }
    }
    .breadcrumb { padding: 12px 16px; background: #181818; border-bottom: 1px solid #282828; font-size: 24px; font-weight: bold; flex-shrink: 0; }
    .breadcrumb a { color: #b3b3b3; cursor: pointer; }
    .breadcrumb a:hover { color: #fff; }
    .content { padding: 16px; flex: 1; overflow-y: auto; overflow-x: hidden; }
    .artist-link { color: #b3b3b3; cursor: pointer; }
    .artist-link:hover { color: #fff; text-decoration: underline; }
    .track-name a, .track-artist a, .track-album a, .artist-link a, h3 a { color: inherit; text-decoration: none; }
    .track-name a:hover, .track-artist a:hover, .track-album a:hover, .artist-link a:hover, h3 a:hover { text-decoration: underline; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #282828; border-radius: 8px; padding: 24px; max-width: 400px; width: 90%; }
    .modal h2 { margin: 0 0 16px 0; color: #1db954; }
    .modal p { color: #b3b3b3; line-height: 1.5; margin: 8px 0; }
    .modal button { background: #1db954; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-top: 16px; }
    .section-header { font-size: 18px; font-weight: bold; color: #fff; padding: 16px 0 8px 0; list-style: none; border-top: 1px solid #333; margin-top: 8px; }
    .section-header:first-child { border-top: none; margin-top: 0; }
    .playlist-section { display: grid; grid-template-columns: repeat(var(--column-count, 3), 1fr); gap: 4px; list-style: none; padding: 0; margin: 0; }
    .tracks.sectioned { column-count: unset; display: block; }
    .tracks.grid-view { column-count: unset; display: grid; grid-template-columns: repeat(var(--column-count, 3), 1fr); gap: 4px; }
    .loading-more { grid-column: 1 / -1; padding: 16px; color: #b3b3b3; text-align: center; }
  </style>
</head>
<body>
  <div id="login">
    <button onclick="showHelp()" title="About (?)" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;font-weight:bold;color:#b3b3b3">?</button>
    <div style="display:flex;flex-direction:column;gap:12px;text-align:center">
      <button onclick="loginWith('ncspot')" autofocus style="display:flex;flex-direction:column;align-items:center;line-height:1.4">
        <span>Login using ncspot</span>
        <span id="ncspot-note" style="font-size:12px;opacity:0.7"></span>
      </button>
      <button onclick="loginWith('playpause')" style="display:flex;flex-direction:column;align-items:center;line-height:1.4;background:#333">
        <span>Login using playpause</span>
        <span style="font-size:12px;opacity:0.7">(radio/recommendations, DJ, and Explore won't work)</span>
      </button>
    </div>
  </div>
  <div id="app">
    <div class="header">
      <div class="search-container">
        <input type="text" id="search" placeholder="Search tracks..." />
        <span id="search-clear" onmousedown="event.preventDefault(); clearSearch()">⊗</span>
      </div>
      <button id="nav-dj" onclick="playDJ()" title="DJ (d)"><img src="https://lexicon-assets.spotifycdn.com/DJ-Beta-CoverArt-300.jpg" style="width:20px;height:20px;border-radius:4px;vertical-align:middle"></button>
      <button id="nav-playlists" onclick="loadPlaylists()" title="Playlists (p)">📜</button>
      <button id="nav-albums" onclick="loadSavedAlbums()" title="Saved Albums (s)">💿</button>
      <button id="nav-liked" onclick="loadLikedSongs()" title="Liked Songs (l)">❤️</button>
      <button id="nav-topArtists" onclick="loadTopArtists()" title="Top Artists (a)">⬆️A</button>
      <button id="nav-topTracks" onclick="loadTopTracks()" title="Top Tracks (t)">⬆️T</button>
      <button id="nav-explore" onclick="loadExplore()" title="Explore (e)">✨</button>
      <input type="range" id="column-count" min="1" max="10" value="3" oninput="setColumnCount(this.value)" title="Columns" />
      <button onclick="logout()" title="Logout">🚪</button>
      <button onclick="showHelp()" title="About (?)" style="font-weight:bold">?</button>
    </div>
    <div class="breadcrumb" id="breadcrumb" style="display:none"></div>
    <div class="content">
      <ul class="tracks" id="tracks"></ul>
      <div id="lyrics-view"></div>
    </div>
    <div class="player">
      <img id="player-art" src="" alt="" style="cursor:pointer;display:none" onclick="showCurrentAlbum()" />
      <div class="player-info">
        <div id="player-track">Not playing</div>
        <div id="player-artist" style="color:#b3b3b3;font-size:12px"></div>
      </div>
      <div class="player-controls">
        <button onclick="previous()">⏮</button>
        <button onclick="togglePlay()" id="play-btn" disabled style="opacity:0.5">▶</button>
        <button onclick="next()">⏭</button>
      </div>
      <div class="progress-container">
        <span class="progress-time" id="progress-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
          <span id="seek-tooltip" style="display:none;position:absolute;background:#282828;padding:4px 8px;border-radius:4px;font-size:12px;top:-28px;transform:translateX(-50%)"></span>
        </div>
        <span class="progress-time" id="progress-total">0:00</span>
      </div>
      <button id="loop-btn" onclick="toggleLoop()" title="Loop" style="font-size:20px">↻</button>
      <button id="cc-btn" onclick="toggleLyrics()" title="Lyrics (c)"><span class="cc-icon">CC</span></button>
      <button id="nav-queue" class="queue-btn" onclick="showQueue()" title="Queue (q)">☰</button>
      <div class="device-picker">
        <button onclick="toggleDevices()" title="Devices">📱</button>
        <div class="device-menu" id="device-menu"></div>
      </div>
    </div>
  </div>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="app.js"></script>
</body>
</html>
