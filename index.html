  <title>SimpleSpot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; }
    #login { display: flex; align-items: center; justify-content: center; height: 100vh; height: 100dvh; }
    #login button { background: #1db954; color: #fff; border: none; padding: 16px 32px; font-size: 18px; border-radius: 24px; cursor: pointer; }
    #app { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
    #app.show { display: flex; }
    .header { padding: 16px; background: #181818; display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
    .header input[type="text"] { flex: 1; padding: 10px 16px; border-radius: 20px; border: none; background: #282828; color: #fff; }
    .header button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; color: #b3b3b3; border-radius: 8px; border: 2px solid transparent; }
    .header button.active, .player button.active { border-color: #1db954; }
    .player { background: #181818; padding: 16px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .player img { width: 56px; height: 56px; border-radius: 4px; }
    .player-info { flex: 1; }
    .player-controls { display: flex; align-items: center; }
    .player-controls button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; width: 32px; height: 32px; line-height: 32px; text-align: center; padding: 0; }
    .tracks { list-style: none; column-count: var(--column-count, 3); column-gap: 4px; }
    .tracks > * { break-inside: avoid; }
    .tracks h3 { column-span: all; }
    .track { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 4px; cursor: pointer; min-width: 0; }
    .track:hover { background: #282828; }
    .track img { width: 40px; height: 40px; border-radius: 4px; flex-shrink: 0; }
    .track-art { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
    .track-art img { width: 100%; height: 100%; border-radius: 4px; }
    .track-art .play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); border-radius: 4px; opacity: 0; transition: opacity 0.15s; cursor: pointer; }
    .track-art .play-overlay::before { content: '▶'; color: #fff; font-size: 16px; }
    .track-art:hover .play-overlay { opacity: 1; }
    .track-info { flex: 1; min-width: 0; overflow: hidden; }
    .track-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-num { color: #b3b3b3; font-size: 14px; min-width: 24px; text-align: center; }
    .track-num-col { display: flex; flex-direction: column; align-items: center; min-width: 24px; gap: 2px; }
    .track-num-col .queue-btn { font-size: 14px; padding: 0; line-height: 1; }
    .track-num-col .radio-btn { font-size: 12px; padding: 0; line-height: 1; background: none; border: none; color: #b3b3b3; cursor: pointer; }
    .track-num-col .radio-btn:hover { color: #1db954; }
    .device-picker { position: relative; }
    .device-picker button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; }
    .device-menu { position: absolute; bottom: 100%; right: 0; background: #282828; border-radius: 8px; padding: 8px; min-width: 200px; display: none; }
    .device-menu.show { display: block; }
    .device-item { padding: 8px; border-radius: 4px; cursor: pointer; }
    .device-item:hover { background: #383838; }
    .device-item.active { color: #1db954; background: #1db95420; }
    .progress-container { display: flex; align-items: center; gap: 8px; width: 300px; }
    .progress-bar { flex: 1; height: 4px; background: #404040; border-radius: 2px; cursor: pointer; position: relative; }
    .progress-bar:hover { height: 6px; }
    .progress-fill { height: 100%; background: #1db954; border-radius: 2px; width: 0%; }
    .progress-time { font-size: 11px; color: #b3b3b3; min-width: 40px; }
    .volume-container { display: flex; align-items: center; gap: 8px; }
    #volume-slider { width: 80px; cursor: pointer; }
    .queue-btn { background: none; border: none; color: #b3b3b3; font-size: 18px; cursor: pointer; border-radius: 8px; padding: 4px 8px; border: 2px solid transparent; }
    .queue-btn:hover { color: #fff; }
    .queue-btn.active { border-color: #1db954; }
    button#loop-btn, button#cc-btn { background: none; border: none; padding: 8px; color: #b3b3b3; cursor: pointer; }
    .cc-icon { border: 1px solid currentColor; border-radius: 2px; padding: 1px 3px; font-size: 12px; font-weight: bold; }
    button#loop-btn:hover, button#cc-btn:hover { color: #fff; }
    button#loop-btn.active, button#cc-btn.active { color: #1db954; }
    #lyrics-view { display: none; background: #121212; text-align: center; }
    #lyrics-view.active { display: block; }
    .lyrics-title-wrap { background: #121212; padding: 16px; position: sticky; top: -16px; margin: -16px -16px 0 -16px; padding: 16px; }
    .lyrics-title { font-size: 32px; color: #b3b3b3; border-bottom: 1px solid #b3b3b3; display: inline-block; padding-bottom: 8px; }
    .lyrics-lines { padding: 0 20px 20px; }
    #lyrics-view .lyric-line { padding: 4px 16px; font-size: 24px; color: #666; transition: all 0.3s; cursor: pointer; }
    #lyrics-view .lyric-line:hover { color: #999; }
    #lyrics-view .lyric-line.active { color: #fff; font-size: 28px; font-weight: bold; }
    #lyrics-view .lyrics-error { color: #b3b3b3; font-size: 18px; margin-top: 40px; }
    .track-album { font-size: 12px; color: #b3b3b3; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-album:hover { text-decoration: underline; }
    #column-count { width: 100px; cursor: pointer; }
    
    /* Mobile styles */
    @media (max-width: 600px) {
      #column-count { display: none; }
      .header { gap: 8px; }
      .header input[type="text"] { flex: 1; min-width: 60px; }
      .header input[type="text"]:focus { position: absolute; left: 8px; right: 8px; width: auto; z-index: 10; }
      .tracks { column-count: 1; }
      .player { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0)); flex-wrap: wrap; gap: 8px; }
      .progress-container { width: 100%; order: 10; }
      .volume-container { display: none; }
    }
    .breadcrumb { padding: 12px 16px; background: #181818; border-bottom: 1px solid #282828; font-size: 24px; font-weight: bold; flex-shrink: 0; }
    .breadcrumb a { color: #b3b3b3; cursor: pointer; }
    .breadcrumb a:hover { color: #fff; }
    .content { padding: 16px; flex: 1; overflow-y: auto; overflow-x: hidden; }
    .artist-link { color: #b3b3b3; cursor: pointer; }
    .artist-link:hover { color: #fff; text-decoration: underline; }

  <script>
// Client IDs
const PLAYPAUSE_CLIENT_ID = '1366988155e64d34b759879f2a575cdd';
const NCSPOT_CLIENT_ID = 'd420a117a32841c2b3474932e49fb54b';
const SCOPES = 'streaming user-read-email user-read-private user-library-read user-read-playback-state user-modify-playback-state playlist-read-private user-top-read';

// Dynamic client ID based on user choice (stored in localStorage)
function getClientId() {
  const choice = localStorage.getItem('chosen_client');
  if (choice === 'ncspot') return NCSPOT_CLIENT_ID;
  if (choice === 'playpause') return PLAYPAUSE_CLIENT_ID;
  return null;
}

function getRedirectUri(clientChoice) {
  return clientChoice === 'ncspot' 
    ? 'http://127.0.0.1/login' 
    : window.location.href.split('?')[0].split('#')[0];
}

function isNcspotClient() {
  return localStorage.getItem('chosen_client') === 'ncspot';
}

// Auth storage helpers - namespace by client ID so switching clients requires re-auth
function getAuthPrefix() { return `auth_${getClientId()}_`; }
function getAuth(key) { return localStorage.getItem(getAuthPrefix() + key); }
function setAuth(key, value) { localStorage.setItem(getAuthPrefix() + key, value); }
function clearAuth() {
  ['access_token', 'refresh_token', 'token_expiry', 'code_verifier'].forEach(k => 
    localStorage.removeItem(getAuthPrefix() + k));
}

let accessToken = null;
let player = null;
let deviceId = null;
let currentState = null;
let currentAlbumUri = null;

let progressInterval = null;
let lastTrackUri = null;
let lastPlayState = null;
let queueRefreshPending = false;
let queueRenderVersion = 0; // Incremented each render to detect stale renders

// Local queue management
let localQueue = []; // Array of track URIs
let currentTrackUri = null;
let playingFromQueueInProgress = false; // Guard against rapid duplicate calls
let savedContextUri = null; // Remember context even when playing from local queue
let savedContextType = null;
let contextResumeTrackUri = null; // Track to resume from after local queue is exhausted
let isNavigatingBack = false; // Flag to prevent pushing state during popstate

// Loop mode
let loopEnabled = localStorage.getItem('loop_enabled') === 'true';
let lyricsEnabled = false;
let currentLyrics = null;
let lyricsTrackKey = null;
let loopState = null; // Saved state to restore when loop triggers

// Navigation - integrates with browser history
function navigate(route, params = {}, replace = false) {
  const state = { route, params };
  if (!isNavigatingBack) {
    if (replace) {
      history.replaceState(state, '', location.pathname);
    } else {
      history.pushState(state, '', location.pathname);
    }
  }
  setActiveNav(route);
}

function setActiveNav(route) {
  // Clear all active states (except loop button which has its own state)
  document.querySelectorAll('.header button.active, .player button.active:not(#loop-btn)').forEach(b => b.classList.remove('active'));
  // Set active on matching nav button
  const btn = document.getElementById('nav-' + route);
  if (btn) btn.classList.add('active');
}

function handleNavigation(state) {
  if (!state?.route) return;
  const { route, params } = state;
  switch (route) {
    case 'liked': loadLikedSongs(true); break;
    case 'albums': loadSavedAlbums(true); break;
    case 'playlists': loadPlaylists(true); break;
    case 'topArtists': loadTopArtists(true); break;
    case 'topTracks': loadTopTracks(true); break;
    case 'playlist': loadPlaylist(params.id, params.name, true); break;
    case 'album': loadAlbum(params.id, true); break;
    case 'artist': loadArtist(params.id, true); break;
    case 'queue': showQueue(true); break;
    case 'search': search(params.q, true); break;
  }
}

window.addEventListener('popstate', (e) => {
  isNavigatingBack = true;
  handleNavigation(e.state);
  isNavigatingBack = false;
});

// PKCE helpers
function generateCodeVerifier() {
  const arr = new Uint8Array(64);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode(...arr)).replace(/[^a-zA-Z0-9]/g, '').slice(0, 128);
}

async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function loginWith(clientChoice) {
  // Store the client choice before starting auth flow
  localStorage.setItem('chosen_client', clientChoice);
  
  const clientId = clientChoice === 'ncspot' ? NCSPOT_CLIENT_ID : PLAYPAUSE_CLIENT_ID;
  const redirectUri = getRedirectUri(clientChoice);
  
  const verifier = generateCodeVerifier();
  setAuth('code_verifier', verifier);
  const challenge = await generateCodeChallenge(verifier);
  
  const params = new URLSearchParams({
    client_id: clientId,
    response_type: 'code',
    redirect_uri: redirectUri,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge
  });
  const authUrl = 'https://accounts.spotify.com/authorize?' + params;
  
  if (clientChoice === 'ncspot') {
    showNcspotLoginModal(authUrl);
  } else {
    window.location = authUrl;
  }
}

function showNcspotLoginModal(authUrl) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'ncspot-modal';
  modal.innerHTML = `
    <div class="modal" style="max-width:500px">
      <h2>Login with Spotify (ncspot)</h2>
      <p style="color:#b3b3b3;margin:16px 0">After authorizing, you'll be redirected to a page that won't load. Copy the URL from the popup's address bar and paste it below:</p>
      <button onclick="window.open('${authUrl}', 'spotify-auth', 'width=500,height=700')" style="width:100%;margin-bottom:16px">
        Open Spotify Auth
      </button>
      <input type="text" id="ncspot-url" placeholder="Paste the redirect URL here (http://127.0.0.1/login?code=...)" 
        style="width:100%;padding:10px;border-radius:4px;border:1px solid #444;background:#181818;color:#fff;margin-bottom:16px" />
      <div style="display:flex;gap:8px">
        <button onclick="this.closest('.modal-overlay').remove()" style="flex:1;background:#333">Cancel</button>
        <button onclick="handleNcspotUrl()" style="flex:1">Continue</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function handleNcspotUrl() {
  const input = document.getElementById('ncspot-url');
  const url = input.value.trim();
  if (!url) return;
  
  try {
    const parsedUrl = new URL(url);
    const code = parsedUrl.searchParams.get('code');
    if (!code) {
      alert('No authorization code found in URL');
      return;
    }
    // Process the code
    document.getElementById('ncspot-modal').remove();
    if (!await processAuthCode(code, false, true)) {
      alert('Authentication failed. Please try again.');
    }
  } catch (e) {
    alert('Invalid URL: ' + e.message);
  }
}

function logout() {
  if (!confirm('Log out of Spotify?')) return;
  forceRelogin('user logout');
}

function clearClientChoice() {
  localStorage.removeItem('chosen_client');
}

function forceRelogin(reason = 'unknown') {
  console.error('FORCE RELOGIN:', reason, new Error().stack);
  if (player) player.disconnect();
  clearAuth();
  clearClientChoice();
  window.location.reload();
}

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (!code) return false;
  return await processAuthCode(code, true, false);
}

async function processAuthCode(code, clearUrl = false, reload = false) {
  const verifier = getAuth('code_verifier');
  const clientId = getClientId();
  const redirectUri = getRedirectUri(localStorage.getItem('chosen_client'));
  
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: clientId,
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: redirectUri,
      code_verifier: verifier
    })
  });
  const data = await res.json();
  if (data.access_token) {
    setAuth('access_token', data.access_token);
    setAuth('refresh_token', data.refresh_token);
    setAuth('token_expiry', Date.now() + data.expires_in * 1000);
    if (clearUrl) {
      window.history.replaceState({}, '', window.location.href.split('?')[0]);
    }
    if (reload) {
      window.location.reload();
    }
    return true;
  }
  console.error('Auth failed:', data.error || 'no access_token');
  return false;
}

let refreshPromise = null;
async function refreshToken() {
  // Prevent concurrent refresh attempts
  if (refreshPromise) {
    console.log('Token refresh already in progress, waiting...');
    return refreshPromise;
  }
  
  const refresh = getAuth('refresh_token');
  if (!refresh) {
    console.warn('No refresh token available!');
    return false;
  }
  
  console.log('Starting token refresh...');
  
  refreshPromise = (async () => {
    try {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: getClientId(),
          grant_type: 'refresh_token',
          refresh_token: refresh
        })
      });
      const data = await res.json();
      if (data.access_token) {
        setAuth('access_token', data.access_token);
        setAuth('token_expiry', Date.now() + data.expires_in * 1000);
        // Spotify may issue a new refresh token - save it if present
        if (data.refresh_token) {
          console.log('New refresh token received, saving');
          setAuth('refresh_token', data.refresh_token);
        }
        return true;
      }
      console.warn('Token refresh failed:', data.error || 'no access_token', data);
      return false;
    } catch (e) {
      console.error('Token refresh error:', e);
      return false;
    } finally {
      refreshPromise = null;
    }
  })();
  
  return refreshPromise;
}

async function api(endpoint, opts = {}, _retry = false) {
  // Check if token needs refresh before API call (with 60s buffer)
  if (Date.now() > getAuth('token_expiry') - 60000) {
    console.log('Token expiring soon, refreshing before API call');
    if (!await refreshToken()) {
      forceRelogin('api: token refresh failed before call');
      return null;
    }
    accessToken = getAuth('access_token');
  }
  
  const res = await fetch('https://api.spotify.com/v1' + endpoint, {
    ...opts,
    headers: { Authorization: 'Bearer ' + accessToken, ...opts.headers }
  });
  if (res.status === 204 || res.status === 202) return null;
  
  // On 401, try refreshing token and retry once
  if (res.status === 401 && !_retry) {
    console.log('Got 401, attempting token refresh and retry');
    if (await refreshToken()) {
      accessToken = getAuth('access_token');
      return api(endpoint, opts, true);
    } else {
      forceRelogin('api: token refresh failed after 401');
      return null;
    }
  }
  
  if (!res.ok) {
    console.error('API error:', res.status, res.statusText, endpoint);
    return null;
  }
  const text = await res.text();
  if (!text) return null;
  try {
    return JSON.parse(text);
  } catch (e) {
    // Don't log for successful responses - some endpoints return non-JSON
    if (res.status >= 400) {
      console.error('API error response:', res.status, endpoint, text.substring(0, 200));
    }
    return null;
  }
}

function getDeviceName() {
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) return 'Android';
  if (/iPhone/i.test(ua)) return 'iPhone';
  if (/iPad/i.test(ua)) return 'iPad';
  if (/Mac/i.test(ua)) return 'Mac';
  if (/Windows/i.test(ua)) return 'Windows';
  if (/Linux/i.test(ua)) return 'Linux';
  return 'Browser';
}

function initPlayer() {
  player = new Spotify.Player({
    name: getDeviceName(),
    getOAuthToken: async cb => {
      // Refresh with 60s buffer to avoid race conditions
      if (Date.now() > getAuth('token_expiry') - 60000) {
        console.log('SDK requesting token, refreshing (expiry soon)');
        if (!await refreshToken()) {
          forceRelogin('SDK getOAuthToken: token refresh failed');
          return;
        }
      }
      cb(getAuth('access_token'));
    },
    volume: (localStorage.getItem('volume') || 50) / 100
  });
  
  player.addListener('ready', ({ device_id }) => {
    deviceId = device_id;
    setupMediaSessionHandlers();
    resumePlaybackIfNeeded();
  });
  
  player.addListener('player_state_changed', state => {
    if (!state) {
      // Playback transferred to another device - clear UI
      clearPlayerUI();
      return;
    }
    currentState = state;
    const track = state.track_window.current_track;
    currentAlbumUri = track.album.uri;
    document.getElementById('player-track').textContent = track.name;
    document.getElementById('player-artist').textContent = track.artists.map(a => a.name).join(', ');
    const art = document.getElementById('player-art');
    art.src = track.album.images[0]?.url || '';
    art.style.display = track.album.images[0]?.url ? 'block' : 'none';
    // Re-enable all player controls
    document.querySelectorAll('.player-controls button').forEach(btn => {
      btn.disabled = false;
      btn.style.opacity = '1';
    });
    const playBtn = document.getElementById('play-btn');
    playBtn.textContent = state.paused ? '▶' : '⏸';
    document.getElementById('progress-total').textContent = formatTime(state.duration);
    updateProgress();
    
    // Use interval only when playing, update every second
    clearInterval(progressInterval);
    if (!state.paused) {
      progressInterval = setInterval(updateProgress, 1000);
    }
    
    // Update MPRIS / Media Session
    updateMediaSession(track, state);
    
    // Store play state in memory (saved to localStorage on beforeunload)
    lastPlayState = {
      trackUri: track.uri,
      position: state.position,
      paused: state.paused,
      contextUri: state.context?.uri || null,
      timestamp: Date.now()
    };
    
    // Save context when we have one (so we can use it after playing from local queue)
    if (state.context?.uri) {
      savedContextUri = state.context.uri;
      const [, type] = state.context.uri.split(':');
      savedContextType = type;
      // Clear resume point when we're back in a context
      contextResumeTrackUri = null;
    }
    
    // Track changed - refresh queue view and lyrics
    if (track.uri !== lastTrackUri || queueRefreshPending) {
      lastTrackUri = track.uri;
      currentTrackUri = track.uri;
      queueRefreshPending = false;
      
      if (localStorage.getItem('last_view') === 'queue') {
        renderQueueFromState(state);
      }
      
      // Fetch new lyrics if lyrics view is active
      if (lyricsEnabled) {
        fetchAndShowLyrics();
      }
    }
    
    // Detect track ending - position near end and paused, or next_tracks empty
    // Play next from local queue or loop if enabled
    if (state.paused && state.position === 0 && track.uri === currentTrackUri) {
      // Guard against multiple rapid calls
      if (playingFromQueueInProgress) return;
      
      if (localQueue.length > 0) {
        playingFromQueueInProgress = true;
        // Track finished, play next from local queue
        playNextFromLocalQueue().finally(() => {
          playingFromQueueInProgress = false;
        });
      } else if (loopEnabled && !state.track_window?.next_tracks?.length) {
        // Queue empty and no context tracks left - try to loop
        playingFromQueueInProgress = true;
        if (!restoreLoopState()) {
          playingFromQueueInProgress = false;
        } else {
          setTimeout(() => { playingFromQueueInProgress = false; }, 1000);
        }
      }
    }
  });
  
  player.connect();
}

window.onSpotifyWebPlaybackSDKReady = () => {
  if (accessToken) initPlayer();
};

// Utility
function showLoading() {
  document.getElementById('tracks').innerHTML = '<li style="padding:16px;color:#b3b3b3">Loading...</li>';
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Generate shareable link - wraps text in <a> with Spotify URL
// Left-click does onclick action, right-click gives native "Copy link" option
function shareLink(type, id, text, onclick) {
  const url = `https://open.spotify.com/${type}/${id}`;
  return `<a href="${url}" onclick="event.preventDefault(); ${onclick}">${text}</a>`;
}

// Radio - get recommendations and add to queue
async function startRadio(type, id) {
  let seedParam = '';
  let seedTrackUris = []; // Track URIs to queue before recommendations
  
  if (type === 'track') {
    seedParam = `seed_tracks=${id}`;
    seedTrackUris = [`spotify:track:${id}`];
  } else if (type === 'artist') {
    seedParam = `seed_artists=${id}`;
    // For artists, get their top tracks to queue first
    const topTracks = await api(`/artists/${id}/top-tracks?market=US`);
    seedTrackUris = topTracks.tracks?.slice(0, 5).map(t => t.uri) || [];
  } else if (type === 'album') {
    // Use first 5 tracks from album as seeds
    const album = await api(`/albums/${id}`);
    const tracks = album.tracks?.items?.slice(0, 5) || [];
    const trackIds = tracks.map(t => t.id).join(',');
    if (!trackIds) return;
    seedParam = `seed_tracks=${trackIds}`;
    seedTrackUris = tracks.map(t => t.uri);
  } else if (type === 'playlist') {
    // Use first 5 tracks from playlist as seeds
    const playlist = await api(`/playlists/${id}/tracks?limit=5`);
    const tracks = playlist.items?.map(i => i.track).filter(Boolean) || [];
    const trackIds = tracks.map(t => t.id).join(',');
    if (!trackIds) return;
    seedParam = `seed_tracks=${trackIds}`;
    seedTrackUris = tracks.map(t => t.uri);
  }
  
  const recs = await api(`/recommendations?${seedParam}&limit=20`);
  if (!recs?.tracks?.length) {
    alert('No recommendations found');
    return;
  }
  
  // Add seed tracks first, then recommendations
  const firstTrackUri = seedTrackUris[0] || recs.tracks[0]?.uri;
  [...seedTrackUris, ...recs.tracks.map(t => t.uri)].forEach(uri => {
    if (!localQueue.includes(uri)) {
      localQueue.push(uri);
    }
  });
  saveLocalQueue();
  
  // Switch to queue view and start playing first track
  await showQueue();
  if (firstTrackUri) {
    playTrack(firstTrackUri);
  }
}

// Progress & Volume
function updateProgress() {
  if (!currentState) return;
  player.getCurrentState().then(state => {
    if (!state) return;
    const pct = (state.position / state.duration) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-current').textContent = formatTime(state.position);
    
    // Update lyrics highlight
    if (lyricsEnabled && lastPlayState) {
      lastPlayState.position = state.position;
      updateLyricsHighlight();
    }
  });
}

// Seek bar with tooltip
(function() {
  const bar = document.getElementById('progress-bar');
  const tooltip = document.getElementById('seek-tooltip');
  
  function showTooltip(e) {
    if (!currentState) return;
    const rect = bar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const time = pct * currentState.duration;
    tooltip.textContent = formatTime(time);
    tooltip.style.left = (pct * 100) + '%';
    tooltip.style.display = 'block';
  }
  
  bar.addEventListener('mousemove', showTooltip);
  bar.addEventListener('mouseleave', () => tooltip.style.display = 'none');
  bar.addEventListener('click', e => {
    if (!currentState) return;
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    player.seek(pct * currentState.duration);
  });
})();

// Search
async function search(q, fromHistory = false) {
  if (!fromHistory) navigate('search', { q });
  setBreadcrumb([{ name: 'Search: ' + q }]);
  showLoading();
  
  // Fetch albums and tracks with pagination
  let allAlbums = [];
  let allTracks = [];
  
  // First request
  const data = await api('/search?type=track,album&limit=50&q=' + encodeURIComponent(q));
  allAlbums = data.albums?.items || [];
  allTracks = data.tracks?.items || [];
  
  // Fetch more albums if available (up to 100 total)
  if (data.albums?.next) {
    const more = await api(data.albums.next.replace('https://api.spotify.com/v1', ''));
    allAlbums = allAlbums.concat(more?.items || []);
  }
  
  // Fetch more tracks if available (up to 100 total)
  if (data.tracks?.next) {
    const more = await api(data.tracks.next.replace('https://api.spotify.com/v1', ''));
    allTracks = allTracks.concat(more?.items || []);
  }
  
  const results = { albums: { items: allAlbums }, tracks: { items: allTracks } };
  localStorage.setItem('last_search', JSON.stringify({ query: q, data: results }));
  localStorage.setItem('last_view', 'search');
  renderSearchResults(results);
}

function renderTrackItems(tracks, contextUri, isQueueRemove = false, startNum = 1, contextOffset = 0) {
  return tracks.map((t, i) => {

    ).join(', ') || '';
    const playAction = contextUri 
      ? `playFromContext('${contextUri}', ${contextOffset + i}, '${t.uri}')`
      : `playTrack('${t.uri}')`;
    return `

          ? `<button class="queue-btn" onclick="event.stopPropagation(); removeFromQueue(${i})" title="Remove from queue">−</button>`
          : `<button class="queue-btn" onclick="event.stopPropagation(); addToQueue('${t.uri}')" title="Add to queue">+</button>`
        }

      <div class="track-art" onclick="event.stopPropagation(); ${playAction}">

  `}).join('');

    method: 'PUT',

  });
}

function playTrack(uri) {
  // Clear context since we're playing a single track
  savedContextUri = null;
  savedContextType = null;
  contextResumeTrackUri = null;
  return play({ uris: [uri] });
}
const playContext = uri => {
  return play({ context_uri: uri });
};
const playFromContext = (contextUri, offset, trackUri) => 
  play(contextUri ? { context_uri: contextUri, offset: { position: offset } } : { uris: [trackUri] });

function saveLocalQueue() {
  localStorage.setItem('local_queue', JSON.stringify(localQueue));
}

function loadLocalQueue() {
  try { localQueue = JSON.parse(localStorage.getItem('local_queue')) || []; }
  catch (e) { localQueue = []; }
}

async function addToQueue(uri) {
  const wasEmpty = localQueue.length === 0;
  if (!localQueue.includes(uri)) {
    localQueue.push(uri);
    saveLocalQueue();
  }
  if (localStorage.getItem('last_view') === 'queue') showQueue();
  await autoPlayIfIdle(wasEmpty);
}

async function addAlbumToQueue(albumId) {
  const wasEmpty = localQueue.length === 0;
  const data = await api(`/albums/${albumId}`);
  const trackUris = data.tracks?.items?.map(t => t.uri) || [];
  trackUris.forEach(uri => {
    if (!localQueue.includes(uri)) localQueue.push(uri);
  });
  saveLocalQueue();
  if (localStorage.getItem('last_view') === 'queue') showQueue();
  await autoPlayIfIdle(wasEmpty);
}

async function addPlaylistToQueue(playlistId) {
  const wasEmpty = localQueue.length === 0;
  const data = await api(`/playlists/${playlistId}/tracks?limit=100`);
  const trackUris = data.items?.map(i => i.track?.uri).filter(Boolean) || [];
  trackUris.forEach(uri => {
    if (!localQueue.includes(uri)) localQueue.push(uri);
  });
  saveLocalQueue();
  if (localStorage.getItem('last_view') === 'queue') showQueue();
  await autoPlayIfIdle(wasEmpty);
}

async function autoPlayIfIdle(wasEmpty) {
  if (!wasEmpty || localQueue.length === 0) return;
  const state = await player?.getCurrentState();
  // Start playing if nothing is playing or playback is paused with no track
  if (!state || (!state.track_window?.current_track && state.paused)) {
    playNextFromLocalQueue();
  }
}

function removeFromQueue(index) {
  if (index >= 0 && index < localQueue.length) {
    localQueue.splice(index, 1);
    saveLocalQueue();
    showQueue();
  }
}

  btn.classList.toggle('active', lyricsEnabled);

async function fetchAndShowLyrics() {
  const lyricsView = document.getElementById('lyrics-view');
  if (!lastPlayState?.trackUri) {
    lyricsView.innerHTML = '<div class="lyrics-error">No track playing</div>';
    return;
  }
  
  // Get track info from the player display
  const trackName = document.getElementById('player-track')?.textContent || '';
  const artistName = document.getElementById('player-artist')?.textContent || '';
  const trackKey = `${artistName} ${trackName}`;
  
  // Don't refetch if same track
  if (trackKey === lyricsTrackKey && currentLyrics) {
    renderLyrics();
    return;
  }
  
  lyricsTrackKey = trackKey;
  lyricsView.innerHTML = '<div class="lyrics-error">Loading lyrics...</div>';
  
  try {
    const query = encodeURIComponent(trackKey);
    const res = await fetch(`/lyrics?name=${query}`);
    const data = await res.json();
    
    if (!data || data.length === 0) {
      currentLyrics = null;
      lyricsView.innerHTML = '<div class="lyrics-error">No lyrics available</div>';
      return;
    }
    
    // Sort by time and filter out empty lines at time 0
    currentLyrics = data.filter(l => l.time > 0 || l.words.trim()).sort((a, b) => a.time - b.time);
    renderLyrics();
  } catch (e) {
    console.error('Lyrics fetch error:', e);
    currentLyrics = null;
    lyricsView.innerHTML = '<div class="lyrics-error">Failed to load lyrics</div>';
  }
}

function renderLyrics() {
  const lyricsView = document.getElementById('lyrics-view');
  if (!currentLyrics || currentLyrics.length === 0) {
    lyricsView.innerHTML = '<div class="lyrics-error">No lyrics available</div>';
    return;
  }
  
  const track = currentState?.track_window?.current_track;
  const title = track ? `<i>${track.name}</i> - ${track.artists.map(a => a.name).join(', ')} - <i>${track.album.name}</i>` : '';
  
  lyricsView.innerHTML = `<div class="lyrics-title-wrap"><div class="lyrics-title">${title}</div></div><div class="lyrics-lines">` +
    currentLyrics.map((line, i) => 
      `<div class="lyric-line" data-time="${line.time}" onclick="seekToLyric(${line.time})">${line.words || '♪'}</div>`
    ).join('') + '</div>';
  
  updateLyricsHighlight();
}

function seekToLyric(timeMs) {
  if (player) player.seek(timeMs);
}

function updateLyricsHighlight() {
  if (!lyricsEnabled || !currentLyrics || !lastPlayState) return;
  
  const position = lastPlayState.position;
  const lines = document.querySelectorAll('#lyrics-view .lyric-line');
  let activeIndex = 0;
  
  // Find the current line based on position
  for (let i = 0; i < currentLyrics.length; i++) {
    if (currentLyrics[i].time <= position) {
      activeIndex = i;
    } else {
      break;
    }
  }
  
  lines.forEach((line, i) => {
    line.classList.toggle('active', i === activeIndex);
  });
  
  // Scroll active line into view
  const activeLine = lines[activeIndex];
  if (activeLine) {
    activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function saveLoopState() {
  loopState = {
    localQueue: [...localQueue],
    savedContextUri,
    savedContextType,
    contextResumeTrackUri,
    currentTrackUri
  };
  localStorage.setItem('loop_state', JSON.stringify(loopState));
}

function restoreLoopState() {
  if (!loopState) {
    const saved = localStorage.getItem('loop_state');
    if (saved) loopState = JSON.parse(saved);
  }
  if (!loopState) return false;
  
  localQueue = [...loopState.localQueue];
  savedContextUri = loopState.savedContextUri;
  savedContextType = loopState.savedContextType;
  contextResumeTrackUri = loopState.contextResumeTrackUri;
  saveLocalQueue();
  
  // Start playing from the beginning
  if (localQueue.length > 0) {
    playNextFromLocalQueue();
    return true;
  } else if (loopState.currentTrackUri) {
    playTrack(loopState.currentTrackUri);
    return true;
  }
  return false;
}

async function playNextFromLocalQueue() {
  if (localQueue.length === 0) return;
  
  // Before breaking context, save what track should play next from context
  if (!contextResumeTrackUri && savedContextUri) {
    const state = await player?.getCurrentState();
    if (state?.track_window?.next_tracks?.[0]) {
      contextResumeTrackUri = state.track_window.next_tracks[0].uri;
    }
  }
  
  const nextUri = localQueue.shift();
  saveLocalQueue();
  await playTrack(nextUri);
}

async function togglePlay() {
  const state = await player?.getCurrentState();
  if (!state) {
    // Try to resume from saved state
    const saved = localStorage.getItem('play_state');
    if (saved) {
      const s = JSON.parse(saved);
      await play(s.contextUri
        ? { context_uri: s.contextUri, offset: { uri: s.trackUri }, position_ms: s.position }
        : { uris: [s.trackUri], position_ms: s.position });
      return;
    }
  }
  player?.togglePlay();
}

async function next() {
  if (localQueue.length > 0) {
    await playNextFromLocalQueue();
  } else if (contextResumeTrackUri && savedContextUri) {
    await play({ context_uri: savedContextUri, offset: { uri: contextResumeTrackUri } });
    contextResumeTrackUri = null;
  } else {
    await api('/me/player/next', { method: 'POST' });
  }
  refreshQueueIfViewing();
}

async function previous() {
  await api('/me/player/previous', { method: 'POST' });
  refreshQueueIfViewing();
}

function refreshQueueIfViewing() {
  // Just mark that we want a refresh - the player_state_changed handler will do the actual refresh
  if (localStorage.getItem('last_view') === 'queue') {
    queueRefreshPending = true;
  }
}

          <button class="radio-btn" onclick="event.stopPropagation(); startRadio('album', '${a.id}')" title="Start radio">📻</button>
        </div>
        <div class="track-art" onclick="event.stopPropagation(); playContext('${a.uri}')">
          <img src="${a.images?.[2]?.url || ''}" />
          <div class="play-overlay"></div>
        </div>
        <div class="track-info">
          <div class="track-name">${shareLink('album', a.id, escapeHtml(a.name), `event.stopPropagation(); loadAlbum('${a.id}')`)}</div>
          <div class="track-artist">${a.album_type} • ${a.release_date?.slice(0,4)}</div>
        </div>
      </li>
    `).join('');
  }
  
  el.innerHTML = html;
}

// Queue
async function showQueue(fromHistory = false) {
  if (!fromHistory) navigate('queue');
  setBreadcrumb([{ name: 'Queue', suffix: '<button onclick="clearQueue()" style="background:#333;border:none;color:#b3b3b3;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:8px">Clear</button>' }]);
  showLoading();
  localStorage.setItem('last_view', 'queue');
  
  // Try to use SDK state first (more up-to-date)
  const sdkState = await player?.getCurrentState();
  if (sdkState) {
    await renderQueueFromState(sdkState);
    return;
  }
  
  // Fallback to API
  const data = await api('/me/player/queue');
  
  // Also get local queue track details
  let localQueueTracks = [];
  if (localQueue.length > 0) {
    const trackIds = localQueue.map(uri => uri.split(':')[2]).join(',');
    const tracksData = await api('/tracks?ids=' + trackIds);
    localQueueTracks = tracksData?.tracks || [];
  }
  
  renderQueue(data, localQueueTracks);
}

async function renderQueueFromState(state) {
  const el = document.getElementById('tracks');
  const myVersion = ++queueRenderVersion;

  let html = '';
  
  // Capture current track URI at start (before any async operations)
  const currentTrack = state.track_window.current_track;
  // Spotify uses track relinking - playlist may have original URI, SDK gives relinked URI
  // Check both the current URI and linked_from URI when searching
  const trackUriForLookup = currentTrack?.uri;
  const linkedFromUri = currentTrack?.linked_from?.uri;
  
  // We'll render Now Playing after fetching context, so we can use playlist track data for correct album art
  let nowPlayingTrack = null; // Will be set to playlist track if found, otherwise SDK track
  
  // Next tracks - fetch from context if available for full list
  // Use saved context if current context is null (e.g., after playing from local queue)
  const contextUri = state.context?.uri || savedContextUri;

  let nextTracks = [];
  let nextTracksOffset = 0;
  let contextName = 'playlist';
  let contextType = null;
  let contextId = null;
  
  if (contextUri) {
    const [, type, id] = contextUri.split(':');
    contextName = type;
    contextType = type;
    contextId = id;
    
    if (type === 'playlist') {
      // Fetch all playlist tracks (handle pagination)
      let allTracks = [];
      let url = `/playlists/${id}/tracks?limit=100`;
      while (url) {
        const playlistData = await api(url);
        allTracks = allTracks.concat(playlistData?.items?.map(i => i.track).filter(t => t) || []);
        url = playlistData?.next ? playlistData.next.replace('https://api.spotify.com/v1', '') : null;
      }
      
      // Find starting position
      let startIndex = 0;
      if (contextResumeTrackUri) {
        startIndex = allTracks.findIndex(t => t.uri === contextResumeTrackUri);
        if (startIndex < 0) startIndex = 0;
        nextTracks = allTracks.slice(startIndex);
        nextTracksOffset = startIndex;
      } else {
        // Check both current URI and linked_from URI (for track relinking)
        let currentIndex = allTracks.findIndex(t => t.uri === trackUriForLookup);
        if (currentIndex < 0 && linkedFromUri) {
          currentIndex = allTracks.findIndex(t => t.uri === linkedFromUri);
        }

        if (currentIndex >= 0) {
          // Use playlist track for Now Playing (has correct album art for relinked tracks)
          nowPlayingTrack = allTracks[currentIndex];
          startIndex = currentIndex + 1;
          nextTracks = allTracks.slice(startIndex);
          nextTracksOffset = startIndex;
        } else {
          // Track not in this playlist - playing a queued track
          // Don't show playlist tracks, fall through to queue API
          nextTracks = [];
        }
      }
    } else if (type === 'album') {
      // Fetch album tracks and add album images
      const albumData = await api(`/albums/${id}`);
      const allTracks = (albumData?.tracks?.items || []).map(t => ({
        ...t,
        album: { id: albumData.id, name: albumData.name, images: albumData.images }
      }));
      
      let startIndex = 0;
      if (contextResumeTrackUri) {
        startIndex = allTracks.findIndex(t => t.uri === contextResumeTrackUri);
        if (startIndex < 0) startIndex = 0;
      } else {
        // Check both current URI and linked_from URI (for track relinking)
        let currentIndex = allTracks.findIndex(t => t.uri === trackUriForLookup);
        if (currentIndex < 0 && linkedFromUri) {
          currentIndex = allTracks.findIndex(t => t.uri === linkedFromUri);
        }
        if (currentIndex >= 0) {
          nowPlayingTrack = allTracks[currentIndex];
          startIndex = currentIndex + 1;
        }
      }
      nextTracks = allTracks.slice(startIndex);
      nextTracksOffset = startIndex;
    }
  }
  
  // Fallback to queue API only if we have a real context
  if (nextTracks.length === 0 && contextUri) {
    const queueData = await api('/me/player/queue');
    nextTracks = queueData?.queue || [];
    nextTracksOffset = 0; // Queue API doesn't give us offset info
  }
  
  // Now render Now Playing - use playlist/album track if found (correct art for relinked tracks)
  if (currentTrack) {
    html = '<h3 style="padding:8px;color:#b3b3b3">Now Playing</h3>';
    if (nowPlayingTrack) {
      html += renderTrackItems([nowPlayingTrack], contextUri, false, null, 0);
    } else {
      html += renderSdkTrackItem(currentTrack);
    }
  }
  
  // Local queue (moved after Now Playing)
  if (localQueue.length > 0) {
    const trackIds = localQueue.map(uri => uri.split(':')[2]).join(',');
    const tracksData = await api('/tracks?ids=' + trackIds);
    const localQueueTracks = tracksData?.tracks || [];
    if (localQueueTracks.length > 0) {
      html += `<h3 style="padding:8px;color:#b3b3b3">Queued (${localQueueTracks.length})</h3>`;
      html += renderLocalQueueItems(localQueueTracks);
    }
  }
  
  if (nextTracks.length > 0 && contextUri) {
    const contextLink = contextType === 'playlist' 
      ? shareLink('playlist', contextId, contextName, `loadPlaylist('${contextId}', '${contextName}')`)
      : contextType === 'album'
      ? shareLink('album', contextId, contextName, `loadAlbum('${contextId}')`)
      : contextName;
    html += `<h3 style="padding:8px;color:#b3b3b3">Next from ${contextLink} (${nextTracks.length})</h3>`;
    html += renderTrackItems(nextTracks, contextUri, false, 1, nextTracksOffset);
  }
  
  // Only update DOM if this render is still current (not superseded by a newer one)
  if (myVersion === queueRenderVersion) {

    el.innerHTML = html || '<p style="padding:16px;color:#b3b3b3">Queue is empty</p>';
  } else {

  }
}

function renderSdkTrackItem(t, num = null) {
  const trackId = t.uri?.split(':')[2] || t.id;
  const albumId = t.album?.uri?.split(':')[2] || '';
  const artistLinks = t.artists?.map(a => {
    const artistId = a.uri?.split(':')[2] || '';
    return `<span class="artist-link">${shareLink('artist', artistId, escapeHtml(a.name), `event.stopPropagation(); loadArtist('${artistId}')`)}</span>`;
  }).join(', ') || '';
  return `
    <li class="track">
      ${num !== null ? `<div class="track-num-col"><span class="track-num">${num}</span></div>` : ''}
      <div class="track-art" onclick="event.stopPropagation(); playTrack('${t.uri}')">
        <img src="${t.album?.images?.[2]?.url || t.album?.images?.[0]?.url || ''}" />
        <div class="play-overlay"></div>
      </div>
      <div class="track-info">
        <div class="track-name">${shareLink('track', trackId, escapeHtml(t.name), `event.stopPropagation(); playTrack('${t.uri}')`)}</div>
        <div class="track-artist">${artistLinks}</div>
        <div class="track-album">${shareLink('album', albumId, escapeHtml(t.album?.name || ''), `event.stopPropagation(); loadAlbum('${albumId}')`)}</div>
      </div>
    </li>
  `;
}

function renderQueue(spotifyData, localQueueTracks) {
  const el = document.getElementById('tracks');
  let html = '';
  
  // Now Playing
  if (spotifyData?.currently_playing) {
    html += '<h3 style="padding:8px;color:#b3b3b3">Now Playing</h3>';
    html += renderTrackItems([spotifyData.currently_playing], null);
  }
  
  // Local queue (user-added, can be removed)
  if (localQueueTracks.length > 0) {
    html += `<h3 style="padding:8px;color:#b3b3b3">Queued (${localQueueTracks.length})</h3>`;
    html += renderLocalQueueItems(localQueueTracks);
  }
  
  // Spotify's context queue (from playlist/album, read-only)
  // Only show if we have a saved context (otherwise it's just duplicates)
  if (spotifyData?.queue?.length > 0 && savedContextUri) {
    const [, type] = savedContextUri.split(':');
    html += `<h3 style="padding:8px;color:#b3b3b3">Next from ${type} (${spotifyData.queue.length})</h3>`;
    html += renderTrackItems(spotifyData.queue, savedContextUri);
  }
  
  el.innerHTML = html || '<p style="padding:16px;color:#b3b3b3">Queue is empty</p>';
}

function renderLocalQueueItems(tracks) {
  return tracks.map((t, i) => {
    if (!t) return '';
    const trackId = t.uri?.split(':')[2] || t.id;
    const artistLinks = t.artists?.map(a => 
      `<span class="artist-link" onclick="event.stopPropagation(); loadArtist('${a.id}')">${escapeHtml(a.name)}</span>`
    ).join(', ') || '';
    return `
    <li class="track">
      <div class="track-num-col">
        <span class="track-num">${i + 1}</span>
        <button class="queue-btn" onclick="event.stopPropagation(); removeFromQueue(${i})" title="Remove from queue">−</button>
        <button class="radio-btn" onclick="event.stopPropagation(); startRadio('track', '${trackId}')" title="Start radio">📻</button>
      </div>
      <div class="track-art" onclick="event.stopPropagation(); playFromLocalQueue(${i})">
        <img src="${t.album?.images?.[2]?.url || ''}" />
        <div class="play-overlay"></div>
      </div>
      <div class="track-info">
        <div class="track-name">${escapeHtml(t.name)}</div>
        <div class="track-artist">${artistLinks}</div>
        ${t.album ? `<div class="track-album" onclick="event.stopPropagation(); loadAlbum('${t.album.id}')">${escapeHtml(t.album.name)}</div>` : ''}
      </div>
    </li>
  `}).join('');
}

async function playFromLocalQueue(index) {
  const uri = localQueue[index];
  localQueue = localQueue.slice(index + 1);
  saveLocalQueue();
  await playTrack(uri);
  refreshQueueIfViewing();
}

  currentState = null;
  clearInterval(progressInterval);
  document.getElementById('player-track').textContent = 'Not playing';
  document.getElementById('player-artist').textContent = '';
  document.getElementById('player-art').src = '';
  document.getElementById('player-art').style.display = 'none';

    btn.disabled = true;
    btn.style.opacity = '0.5';
  });
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-current').textContent = '0:00';
  document.getElementById('progress-total').textContent = '0:00';

async function clearQueue() {
  localQueue = [];
  saveLocalQueue();
  savedContextUri = null;
  savedContextType = null;
  contextResumeTrackUri = null;
  await player.pause();
  localStorage.removeItem('play_state');
  clearPlayerUI();
  document.getElementById('tracks').innerHTML = '<p style="padding:16px;color:#b3b3b3">Queue is empty</p>';
}

// Breadcrumb
function setBreadcrumb(items) {
  const el = document.getElementById('breadcrumb');
  if (!items.length) {
    el.style.display = 'none';
    document.title = 'SimpleSpot';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = items.map((item, i) => 
    item.action 
      ? `<a onclick="${item.action}">${escapeHtml(item.name)}</a>${i < items.length - 1 ? ' › ' : ''}`
      : `<span>${escapeHtml(item.name)}${item.suffix || ''}</span>`
  ).join('');
  // Update page title with last breadcrumb item
  const lastItem = items[items.length - 1];
  document.title = 'SimpleSpot - ' + lastItem.name;
}

// Init
(async () => {
  const hasCodeInUrl = new URLSearchParams(window.location.search).has('code');
  
  // Only process callback if we have a chosen client (i.e., user initiated login)
  const callbackOk = hasCodeInUrl && getClientId() ? await handleCallback() : false;
  
  // If we have ?code= but callback failed, auth flow is broken - start fresh
  if (hasCodeInUrl && getClientId() && !callbackOk) {
    console.warn('OAuth callback failed, clearing state');
    clearAuth();
    clearClientChoice();
    window.history.replaceState({}, '', window.location.href.split('?')[0]);
    return; // Will show login screen
  }
  
  // Clear URL params after successful callback
  if (hasCodeInUrl && callbackOk) {
    window.history.replaceState({}, '', window.location.href.split('?')[0]);
  }
  
  // Check if we have a valid session
  if (getClientId() && (callbackOk || getAuth('access_token'))) {
    if (Date.now() > getAuth('token_expiry')) {
      console.log('Token expired at init, attempting refresh');
      if (!await refreshToken()) { forceRelogin('init: token refresh failed'); return; }
    }
    accessToken = getAuth('access_token');
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('show');
    // Load local queue from storage
    loadLocalQueue();
    // Initialize loop button state
    updateLoopButton();
    
    if (window.Spotify) initPlayer();
    
    // Restore last view from localStorage
    restoreLastView();
  }
})();

function restoreLastView() {
  const lastView = localStorage.getItem('last_view');
  
  if (lastView === 'queue') {
    showQueue();
  } else {
    const lastSearch = localStorage.getItem('last_search');
    if (lastSearch) {
      try {
        const { query, data } = JSON.parse(lastSearch);
        document.getElementById('search').value = query;
        setBreadcrumb([{ name: 'Search: ' + query }]);
        renderSearchResults(data);
      } catch (e) {}
    }
  }
}

document.getElementById('search').addEventListener('keyup', e => {
  if (e.key === 'Enter' && e.target.value) {
    search(e.target.value);
    e.target.blur();
  }
});

// Save play state before page unload (before player disconnects and sets paused=true)
window.addEventListener('beforeunload', () => {
  if (lastPlayState) {
    // Estimate current position based on elapsed time since last state update
    if (!lastPlayState.paused) {
      const elapsed = Date.now() - lastPlayState.timestamp;
      lastPlayState.position = lastPlayState.position + elapsed;
    }
    lastPlayState.timestamp = Date.now();
    localStorage.setItem('play_state', JSON.stringify(lastPlayState));
  }
});

// Refresh token when tab becomes visible (handles Chrome tab freeze)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && getAuth('access_token')) {
    if (Date.now() > getAuth('token_expiry')) {
      console.log('Tab became visible, token expired, attempting refresh');
      if (await refreshToken()) {
        accessToken = getAuth('access_token');
        if (player) {
          player.disconnect();
          initPlayer();
        }
      } else {
        forceRelogin('visibilitychange: token refresh failed');
      }
    }
  }
});

// Column count control
function setColumnCount(count) {
  document.documentElement.style.setProperty('--column-count', count);
  localStorage.setItem('column_count', count);
}

// Restore column count on load
(function() {
  const saved = localStorage.getItem('column_count');
  if (saved) {
    setColumnCount(saved);
    document.getElementById('column-count').value = saved;
  }
})();

// Keyboard shortcuts (when not in input)
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault();
    player?.getCurrentState().then(state => {
      if (!state) return;
      const delta = e.code === 'ArrowLeft' ? -10000 : 10000;
      const newPos = Math.max(0, Math.min(state.duration, state.position + delta));
      player.seek(newPos);
    });
  }
});

// Media Session API (MPRIS support)
function updateMediaSession(track, state) {
  if (!('mediaSession' in navigator)) return;
  
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.name,
    artist: track.artists.map(a => a.name).join(', '),
    album: track.album.name,
    artwork: track.album.images.map(img => ({
      src: img.url,
      sizes: `${img.width || 300}x${img.height || 300}`,
      type: 'image/jpeg'
    }))
  });
  
  navigator.mediaSession.playbackState = state.paused ? 'paused' : 'playing';
  
  if (state.duration) {
    navigator.mediaSession.setPositionState({
      duration: state.duration / 1000,
      position: state.position / 1000,
      playbackRate: 1
    });
  }
}

function setupMediaSessionHandlers() {
  if (!('mediaSession' in navigator)) return;
  
  navigator.mediaSession.setActionHandler('play', () => player?.resume());
  navigator.mediaSession.setActionHandler('pause', () => player?.pause());
  navigator.mediaSession.setActionHandler('previoustrack', previous);
  navigator.mediaSession.setActionHandler('nexttrack', next);
  navigator.mediaSession.setActionHandler('seekto', (details) => {
    if (details.seekTime !== undefined) {
      player?.seek(details.seekTime * 1000);
    }
  });
}

async function resumePlaybackIfNeeded() {
  const saved = localStorage.getItem('play_state');
  if (!saved) return;
  
  try {
    const state = JSON.parse(saved);
    const age = Date.now() - state.timestamp;
    
    // Only restore if saved within last 5 minutes
    if (age > 5 * 60 * 1000) return;
    
    // Fetch track info to update UI
    const trackData = await api('/tracks/' + state.trackUri.split(':')[2]);
    if (trackData) {
      document.getElementById('player-track').textContent = trackData.name;
      document.getElementById('player-artist').textContent = trackData.artists.map(a => a.name).join(', ');
      const art = document.getElementById('player-art');
      art.src = trackData.album.images[0]?.url || '';
      art.style.display = trackData.album.images[0]?.url ? 'block' : 'none';
      document.getElementById('progress-current').textContent = formatTime(state.position);
      document.getElementById('progress-total').textContent = formatTime(trackData.duration_ms);
      document.getElementById('progress-fill').style.width = ((state.position / trackData.duration_ms) * 100) + '%';
      currentAlbumUri = trackData.album.uri;
    }
    
    // Enable play button (don't auto-play due to browser autoplay policies)
    const playBtn = document.getElementById('play-btn');
    playBtn.disabled = false;
    playBtn.style.opacity = '1';
    playBtn.textContent = '▶';
  } catch (e) {}
}
